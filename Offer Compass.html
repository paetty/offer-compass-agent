        <div id="review-viewer" class="page-scroll" aria-label="简历预览"><div id="original-preview"></div></div>
        <div id="review-dock"></div>
        <section id="review-change" class="inline-review" aria-label="逐条审阅" hidden></section>
      </div>
      <aside class="review-side" aria-label="修改建议">
        <div class="hd"><h3>修改建议</h3><small id="review-total"></small></div>
        <div id="review-counts" class="section-title"></div>
        <div id="review-list" class="review-list"></div>
        <p id="review-status" class="m review-status" role="status"></p>
        <details class="review-source"><summary>原件与导出选项</summary>
          <p class="m section-title" id="review-style">${escapeHTML(resumeStyle(source))}</p>
          <p class="m" id="pdf-source-status" role="status"></p>
          <div class="actions"><button type="button" id="download-word" hidden>导出修订 Word</button>
            <button type="button" id="download-changes">导出修订清单</button>
            <button type="button" id="save-reviewed-intent">存为意向</button></div>
        </details>
      </aside>
    </div>
    `;
  const viewer = area.querySelector('#review-viewer');
  const header = area.querySelector('.review-header');
  const preview = area.querySelector('#original-preview');
  const dock = area.querySelector('#review-dock');
  const panel = area.querySelector('#review-change');
  const list = area.querySelector('#review-list');
  const note = area.querySelector('#review-status');
  const sourceStatus = area.querySelector('#pdf-source-status');
  const sourceGate = area.querySelector('#source-gate');
  const modeStatus = area.querySelector('#document-mode');
  const wordButton = area.querySelector('#download-word');
  const print = area.querySelector('#print-resume');
  const checklist = area.querySelector('#download-changes');
  const intent = area.querySelector('#save-reviewed-intent');
  const exportMessage = area.querySelector('#export-message');
  const anchors = new Map();
  const live = () => viewer.isConnected && area.contains(viewer);
  let originalFile = null;
  let kind = 'text';
  let documentMode = 'text_draft';
  let wordOutput = null;
  let sequence = 0;
  let resizeWord;
  let exportReady = demo;
  let selected = changes.find(pending) ?? changes[0];

  function renderDocumentMode(risk = false, message = '') {
    const labels = {
      docx_precise: ['Word 精准修改模式', '继承原段落字体、字号、粗体、缩进、项目符号和图片；正式导出优先使用修订 Word。'],
      pdf_limited: ['PDF 限制修改模式', '只允许长度接近且不改变行数的小幅修改；高风险修改必须改用 Word 原件。'],
      text_draft: ['纯文本草稿模式', '仅生成内容草稿，不承诺保留原始视觉格式。']
    };
    const [label, description] = labels[documentMode];
    modeStatus.classList.toggle('risk', risk);
    modeStatus.innerHTML = `<b>${escapeHTML(label)}</b> · ${escapeHTML(message || description)}`;
  }

  function difference(index, replacement = draft.edits[index]) {
    const before = Array.from(original[index] ?? '');
    const after = Array.from(replacement ?? '');
    let start = 0;
    while (start < before.length && start < after.length && before[start] === after[start]) start++;
    let end = 0;
    while (end < before.length - start && end < after.length - start &&
      before[before.length - end - 1] === after[after.length - end - 1]) end++;
    return { prefix: before.slice(0, start).join(''), removed: before.slice(start, before.length - end).join(''),
      added: after.slice(start, after.length - end).join(''), suffix: end ? before.slice(-end).join('') : '' };
  }

  const reviewedLines = () => draft.edits.map((text, index) => draft.decisions[index] === 'accept' ? text : original[index]);
  const countPending = () => changes.filter(pending).length;

  function updateControls() {
    const remaining = countPending();
    area.querySelector('#review-total').textContent = '共 ' + changes.length + ' 处';
    area.querySelector('#review-counts').innerHTML = `<span class="tag review-plus">已采纳 ${changes.filter(index => draft.decisions[index] === 'accept').length}</span>
      <span class="tag review-minus">待改写 ${remaining}</span>`;
    area.querySelector('#review-progress-label').textContent = '已决定 ' + (changes.length - remaining) + ' / ' + changes.length;
    const progress = area.querySelector('#review-progress');
    progress.max = changes.length || 1;
    progress.value = changes.length - remaining;
    area.querySelector('#accept-all').disabled = !remaining;
    const ordered = [...changes].sort((a, b) => Number(!pending(a)) - Number(!pending(b)));
    list.replaceChildren(...ordered.map(index => {
      const item = document.createElement('button');
      const decision = draft.decisions[index];
      const excerpt = (draft.edits[index] || original[index]).trim();
      item.type = 'button';
      item.className = 'review-item';
      item.dataset.index = String(index);
      item.dataset.decision = decision ?? 'pending';
      item.setAttribute('aria-current', String(index === selected));
      item.innerHTML = `<small>${changes.indexOf(index) + 1} · ${decision === 'accept' ? '已采纳' : decision === 'reject' ? '已保留原文' : '待审阅'}</small>
        <strong>${escapeHTML(excerpt.slice(0, 44) + (excerpt.length > 44 ? '…' : ''))}</strong>
        ${draft.references[index] ? `<small>${escapeHTML(draft.references[index])}</small>` : ''}`;
      item.onclick = () => openNote(index);
      return item;
    }));
    note.textContent = !changes.length ? '当前没有可安全改写的段落。' : remaining ? remaining + ' 处待审阅' : '全部审阅完成';
    print.disabled = remaining > 0 || !exportReady;
    intent.disabled = checklist.disabled = remaining > 0;
    wordButton.hidden = kind !== 'docx';
    wordButton.disabled = remaining > 0 || !wordOutput?.applied.size;
  }

  function hideNote() {
    panel.hidden = true;
    dock.after(panel);
  }

  function bindAnchor(element, index) {
    if (!anchors.has(index)) anchors.set(index, element);
    element.onclick = () => openNote(index, element);
    if (element.tagName !== 'BUTTON') {
      element.tabIndex = 0;
      element.setAttribute('role', 'button');
      element.setAttribute('aria-label', '打开此处简历修订');
      element.onkeydown = event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openNote(index, element);
        }
      };
    }
  }

  function openNote(index, anchor = anchors.get(index)) {
    if (!changes.includes(index)) return;
    selected = index;
    updateControls();
    const referenced = index ? original[index] : [...cited].map(line => original[line]).filter(Boolean).join('\n');
    const restoreFocus = () => (anchor?.isConnected ? anchor : list.querySelector('[aria-current="true"]'))?.focus({ preventScroll: true });
    panel.innerHTML = `<div class="hd"><strong>审阅修改</strong><button type="button" data-close>关闭</button></div>
      <div class="review-redline"><small>修改前</small><del>${escapeHTML(original[index] || '（新增内容）')}</del><small>修改后</small><ins>${escapeHTML(draft.edits[index])}</ins></div>
      <details data-edit><summary>编辑建议</summary><label>建议文字<textarea rows="4" id="review-wording">${escapeHTML(draft.edits[index])}</textarea></label></details>
      ${!index && referenced ? `<p class="m">引用的原文 · ${escapeHTML(referenced)}</p>` : ''}
      <p class="m section-title">依据 · ${escapeHTML(draft.references[index] || '对应的简历原文')}</p>
      <p class="m" data-length-warning role="status"></p>
      <div class="actions"><button type="button" class="review-primary" id="accept-change">✓ 接受修改</button>
        <button type="button" id="reject-change">× 保留原文</button>
        ${pending(index) ? '' : '<button type="button" id="undo-review">重新审阅</button>'}</div>`;
    const wording = panel.querySelector('#review-wording');
    const showLengthWarning = () => {
      const assessment = layoutAssessment(original[index], wording.value, documentMode);
      const warning = panel.querySelector('[data-length-warning]');
      warning.textContent = kind === 'docx' && !index
        ? '新增段落会进入修订清单。Word 原版导出仅写回已有段落。'
        : assessment.layoutRisk
          ? assessment.reasons.join('；') + '。当前修改会影响原版式，请上传 Word 原文件后再正式采纳。'
          : `长度 ${assessment.lengthBefore} → ${assessment.lengthAfter}，当前未发现明显版式风险。`;
      warning.dataset.risk = String(assessment.layoutRisk);
      panel.querySelector('#accept-change').disabled = assessment.layoutRisk;
      renderDocumentMode(assessment.layoutRisk, assessment.layoutRisk ? warning.textContent : '当前修改满足本模式的版式边界。');
    };
    wording.oninput = () => {
      const line = panel.querySelector('.review-redline');
      line.innerHTML = '<small>修改前</small><del>' + escapeHTML(original[index] || '（新增内容）') +
        '</del><small>修改后</small><ins>' + escapeHTML(wording.value) + '</ins>';
      showLengthWarning();
    };
    showLengthWarning();
    panel.querySelector('[data-close]').onclick = () => {
      hideNote();
      restoreFocus();
    };
    const decide = decision => {
      const assessment = layoutAssessment(original[index], wording.value, documentMode);
      if (decision === 'accept' && assessment.layoutRisk) {
        panel.querySelector('[data-length-warning]').textContent = assessment.reasons.join('；') + '。请上传 Word 原文件后再采纳。';
        return;
      }
      if (decision === 'accept') draft.edits[index] = wording.value;
      if (decision) draft.decisions[index] = decision;
      else delete draft.decisions[index];
      hideNote();
      updateControls();
      save();
      if (kind === 'docx') drawWord(originalFile);
      else if (kind === 'pdf') updatePdfMarks();
      else drawText();
      list.querySelector('[aria-current="true"]')?.focus({ preventScroll: true });
    };
    panel.querySelector('#accept-change').onclick = () => decide('accept');
    panel.querySelector('#reject-change').onclick = () => decide('reject');
    const undo = panel.querySelector('#undo-review');
    if (undo) undo.onclick = () => decide(null);
    if (anchor?.isConnected) {
      anchor.scrollIntoView({ block: 'center' });
      const top = anchor.getBoundingClientRect().bottom - viewer.getBoundingClientRect().top + 6;
      panel.style.top = Math.max(0, top) + 'px';
      viewer.append(panel);
    } else {
      panel.style.removeProperty('top');
      dock.append(panel);
    }
    panel.hidden = false;
    panel.scrollIntoView({ block: 'nearest' });
    panel.querySelector('#accept-change').focus({ preventScroll: true });
  }

  function drawText() {
    anchors.clear();
    const unresolved = new Set(changes.filter(index => index && pending(index)));
    const pages = paginateResume(reviewedLines(), unresolved, original);
    for (const page of pages) {
      for (const block of page) {
        if (unresolved.has(block.index)) block.mark = 'removed';
        else if (draft.decisions[block.index]) block.mark = draft.decisions[block.index];
      }
    }
    showPaper(preview, pages);
    preview.querySelectorAll('[data-change]').forEach(element => bindAnchor(element, Number(element.dataset.change)));
  }

  function updatePdfMarks(alreadyRevised = false) {
    anchors.clear();
    preview.querySelectorAll('.pdf-replacement').forEach(element => element.remove());
    const accepted = new Map();
    for (const element of preview.querySelectorAll('.paper-hit')) {
      const line = Number(element.dataset.sourceLine);
      const index = changes.includes(line) ? line : changes.includes(0) && cited.has(line) ? 0 : null;
      element.hidden = index === null;
      if (index !== null) {
        const decision = draft.decisions[index] ?? 'pending';
        element.dataset.decision = decision;
        if (decision === 'accept') {
          element.hidden = true;
          if (!alreadyRevised) {
            const group = accepted.get(index) ?? [];
            group.push(element);
            accepted.set(index, group);
          }
        } else if (decision === 'reject') element.hidden = true;
        else bindAnchor(element, index);
      }
    }
    for (const [index, hits] of accepted) {
      const page = hits[0]?.closest('.pdf-page');
      if (!page) continue;
      const left = Math.min(...hits.map(hit => parseFloat(hit.style.left)));
      const top = Math.min(...hits.map(hit => parseFloat(hit.style.top)));
      const right = Math.max(...hits.map(hit => parseFloat(hit.style.left) + parseFloat(hit.style.width)));
      const bottom = Math.max(...hits.map(hit => parseFloat(hit.style.top) + parseFloat(hit.style.height)));
      const replacement = document.createElement('button');
      replacement.type = 'button';
      replacement.className = 'pdf-replacement';
      replacement.dataset.change = String(index);
      const text = draft.edits[index];
      const match = text.match(/^\s*(?:[-•●▪·⚫]\s*)?([^：:]{1,28}[：:])(.*)$/u);
      if (match) {
        const bullet = document.createElement('span');
        bullet.className = 'pdf-bullet';
        bullet.setAttribute('aria-hidden', 'true');
        const label = document.createElement('strong');
        label.textContent = match[1];
        const body = document.createElement('span');
        body.textContent = match[2];
        replacement.append(bullet, label, body);
      } else replacement.textContent = text.replace(/^\s*[-•●▪·⚫]\s*/u, '');
      replacement.setAttribute('aria-label', '已采纳修改：' + draft.edits[index]);
      Object.assign(replacement.style, { left: left + '%', top: top + '%',
        width: Math.max(8, right - left) + '%', minHeight: Math.max(1.5, bottom - top) + '%' });
      page.append(replacement);
      bindAnchor(replacement, index);
    }
  }

  async function drawWord(file) {
    const request = ++sequence;
    wordOutput = null;
    updateControls();
    sourceStatus.textContent = '正在读取 Word 版面…';
    try {
      const output = await revisedWord(file, original, draft);
      if (request !== sequence || !live()) return;
      wordOutput = output;
      const { data, details } = await wordPreviewData(output.blob);
      try {
        sourceStatus.textContent = '正在用 Word 生成高保真预览…';
        const pdf = await wordPdfPreview(output.blob);
        if (request !== sequence || !live()) return;
        const pages = document.createElement('div');
        await showOriginalPdf(pages, pdf, original, changes.map(index => ({ index })), draft.references,
          draft.origins, () => request === sequence && live());
        if (request !== sequence || !live()) return;
        preview.replaceChildren(...pages.childNodes);
        resizeWord = null;
        updatePdfMarks(true);
        area.querySelector('#review-style').textContent = [resumeStyle(source), ...details].join(' · ');
        sourceStatus.textContent = '高保真预览由本机 Word 生成；头像、文字环绕、换行和分页与 Word 保持一致。' +
          (output.skipped.length ? ' 有 ' + output.skipped.length + ' 条采纳内容仅进入修订清单。' : '');
        exportReady = true;
        print.textContent = '导出';
        print.title = '导出修改后的 Word 原文件格式';
        updateControls();
        return;
      } catch {
        if (request !== sequence || !live()) return;
        sourceStatus.textContent = '本机 Word 高保真转换暂不可用，正在生成网页近似预览…';
      }
      const renderer = await loadParser(WORD_PREVIEW_SCRIPT, 'docx');
      if (request !== sequence || !live()) return;
      const host = document.createElement('div');
      host.className = 'word-preview';
      const root = host.attachShadow({ mode: 'open' });
      const page = document.createElement('div');
      const styles = document.createElement('div');
      root.append(styles, page);
      await renderer.renderAsync(data, page, styles, {
        className: 'resume-docx', renderAltChunks: false, renderComments: false,
        ignoreLastRenderedPageBreak: false, useBase64URL: true
      });
      if (request !== sequence || !live()) return;
      const css = document.createElement('style');
      css.textContent = '.resume-docx-wrapper{padding:0!important;background:transparent!important;overflow:visible!important}.resume-docx-wrapper>section{margin:0 auto 10px!important;overflow:visible!important}.oc-floating-anchor{top:0!important;right:10mm!important;left:auto!important;z-index:2!important}.oc-word-change{outline:2px solid #b8324f;outline-offset:2px;background:#ffdce3!important;cursor:pointer}.oc-word-change:focus-visible{outline:3px solid #6150d5}';
      root.append(css);
      if (details.some(detail => detail.includes('浮动图片'))) {
        for (const image of page.querySelectorAll('img')) {
          let anchor = image.parentElement;
          while (anchor && anchor !== page && getComputedStyle(anchor).position !== 'absolute') anchor = anchor.parentElement;
          if (anchor && anchor !== page) anchor.classList.add('oc-floating-anchor');
        }
      }
      anchors.clear();
      const rendered = new Map();
      for (const paragraph of page.querySelectorAll('article p')) {
        const key = wordTextKey(paragraph.textContent);
        const same = rendered.get(key) ?? [];
        same.push(paragraph);
        rendered.set(key, same);
      }
      for (const index of changes.filter(value => value && pending(value))) {
        const paragraphs = rendered.get(wordTextKey(original[index]));
        if (paragraphs?.length === 1) {
          paragraphs[0].classList.add('oc-word-change');
          bindAnchor(paragraphs[0], index);
        }
      }
      const oldScroll = viewer.scrollTop;
      preview.replaceChildren(host);
      resizeWord = () => {
        const width = page.querySelector('section.resume-docx')?.offsetWidth;
        if (width) host.style.zoom = Math.min(1, (viewer.clientWidth - 18) / width);
      };
      resizeWord();
      viewer.scrollTop = oldScroll;
      area.querySelector('#review-style').textContent = [resumeStyle(source), ...details].join(' · ');
      sourceStatus.textContent = '当前为网页近似预览：头像已固定在页眉右上；浮动图片、文字环绕、最终换行和分页以下载后的 Word 为准。' +
        (output.skipped.length ? ' 有 ' + output.skipped.length + ' 条采纳内容仅进入修订清单。' : '');
    } catch {
      if (request !== sequence || !live()) return;
      if (!wordOutput) {
        kind = 'text';
        documentMode = 'text_draft';
        renderDocumentMode(true, 'Word 版面无法可靠读取，只能生成重排版内容草稿。');
      }
      sourceStatus.textContent = 'Word 版面暂时无法显示。可按文字审阅，原版导出以文件中可定位的段落为准。' +
        (wordOutput?.skipped.length ? ' 有 ' + wordOutput.skipped.length + ' 条采纳内容仅进入修订清单。' : '');
      drawText();
    }
    exportReady = true;
    print.textContent = '导出';
    print.title = '导出修改后的 Word 原文件格式';
    updateControls();
  }

  async function present(file) {
    hideNote();
    originalFile = file;
    area.querySelector('#review-file-name').textContent = file.name;
    const extension = file.name.split('.').pop().toLowerCase();
    sourceGate.classList.add('ready');
    sourceGate.querySelector('strong').textContent = extension === 'pdf' ? '原 PDF 完整预览已关联' : '原 Word 版式预览已关联';
    sourceGate.querySelector('span').textContent = extension === 'pdf'
      ? '照片、线条和版式来自原文件；彩色标记只是审阅覆盖层。'
      : '图片和版式来自原文件；彩色标记只是审阅覆盖层。';
    if (extension === 'docx') {
      kind = 'docx';
      documentMode = 'docx_precise';
      renderDocumentMode();
      await drawWord(file);
      return;
    }
    kind = 'pdf';
    documentMode = 'pdf_limited';
    renderDocumentMode();
    const request = ++sequence;
    exportReady = false;
    print.disabled = true;
    print.textContent = '准备导出…';
    print.title = '正在渲染原 PDF 页面';
    sourceStatus.textContent = '正在渲染原 PDF…';
    try {
      const pages = document.createElement('div');
      await showOriginalPdf(pages, file, original, changes.map(index => ({ index })), draft.references,
        draft.origins, () => request === sequence && live());
      if (request !== sequence || !live()) return;
      preview.replaceChildren(...pages.childNodes);
      updatePdfMarks();
      exportReady = true;
      print.textContent = '导出';
      print.title = '生成修改后的完整 PDF';
      sourceStatus.textContent = '原 PDF 页面 · 导出将保留照片、线条和原始版式，并叠加已采纳文字。';
    } catch {
      if (request !== sequence || !live()) return;
      kind = 'text';
      documentMode = 'text_draft';
      renderDocumentMode(true, '原 PDF 无法可靠定位或渲染，只能生成重排版内容草稿。');
      exportReady = true;
      print.textContent = '导出';
      print.title = '原 PDF 未成功渲染；此导出不保留原始图片和版式';
      sourceStatus.textContent = '原 PDF 暂时无法显示。可重新关联或按提取文字审阅。';
      drawText();
    }
    updateControls();
  }

  function exitReview() {
    hideNote();
    switchRewrite('suggestions');
    $('#show-rewrite')?.focus();
  }
  area.querySelector('#exit-review').onclick = exitReview;
  area.onkeydown = event => {
    if (event.key !== 'Escape') return;
    if (!panel.hidden) panel.querySelector('[data-close]').click();
    else exitReview();
  };
  area.querySelector('#accept-all').onclick = () => {
    if (!countPending()) return;
    for (const index of changes.filter(pending)) draft.decisions[index] = 'accept';
    hideNote();
    updateControls();
    save();
    if (kind === 'docx') drawWord(originalFile);
    else if (kind === 'pdf') updatePdfMarks();
    else drawText();
  };
  wordButton.onclick = () => {
    if (!countPending() && wordOutput?.applied.size) {
      downloadReviewFile(wordOutput.blob, originalFile.name.replace(/\.docx$/iu, '') + '-岗位修订.docx');
    }
  };
  checklist.onclick = () => {
    if (countPending()) return;
    const accepted = changes.filter(index => draft.decisions[index] === 'accept');
    const content = ['简历修订清单', result.job?.role || '', ...accepted.flatMap(index => [
      '', index ? '原文第 ' + index + ' 项' : '新增段落',
      '原文：' + (original[index] || '无'), '采纳：' + draft.edits[index],
      '依据：' + (draft.references[index] || '对应的简历原文')
    ]), ...(accepted.length ? [] : ['没有采纳的修改。'])].join('\n');
    downloadReviewFile(new Blob(['\ufeff', content], { type: 'text/plain;charset=utf-8' }), '简历修订清单.txt');
  };
  print.onclick = async () => {
    if (countPending()) return;
    const acceptedChanges = changes.filter(index => draft.decisions[index] === 'accept');
    if (!acceptedChanges.length) {
      sourceStatus.textContent = '当前文档没有任何改动，无需生成新的 PDF。';
      exportMessage.textContent = '当前文档未修改';
      exportMessage.hidden = false;
      clearTimeout(exportMessage._timer);
      exportMessage._timer = setTimeout(() => { exportMessage.hidden = true; }, 3200);
      return;
    }
    const risky = acceptedChanges.find(index => layoutAssessment(original[index], draft.edits[index], documentMode).layoutRisk);
    if (risky !== undefined) {
      exportMessage.textContent = documentMode === 'pdf_limited' ? '当前修改会影响版式，请上传 Word 原文件' : '当前仅为内容草稿，不能生成正式版';
      exportMessage.hidden = false;
      clearTimeout(exportMessage._timer);
      exportMessage._timer = setTimeout(() => { exportMessage.hidden = true; }, 4200);
      return;
    }
    if (kind === 'docx') {
      const unapplied = acceptedChanges.filter(index => !wordOutput?.applied.has(index));
      if (!wordOutput || unapplied.length) {
        exportMessage.textContent = '部分修改无法安全写回 Word 原段落，已阻止不完整导出';
        exportMessage.hidden = false;
        clearTimeout(exportMessage._timer);
        exportMessage._timer = setTimeout(() => { exportMessage.hidden = true; }, 4200);
        return;
      }
      const name = originalFile.name.replace(/\.docx$/iu, '') + '-岗位修订.docx';
      downloadReviewFile(wordOutput.blob, name);
      exportMessage.textContent = '已导出修改后的 Word';
      exportMessage.hidden = false;
      clearTimeout(exportMessage._timer);
      exportMessage._timer = setTimeout(() => { exportMessage.hidden = true; }, 3200);
      return;
    }
    if (kind === 'pdf') {
      print.disabled = true;
      print.textContent = '正在生成…';
      try {
        await printPdfReview(preview);
      } catch {
        sourceStatus.textContent = '原 PDF 页面合成失败，已阻止残缺导出。请重新关联原件后再试。';
      } finally {
        print.textContent = '导出';
        print.disabled = false;
      }
    }
    else printResume(paginateResume(reviewedLines()));
  };
  intent.onclick = () => {
    if (!countPending()) {
      exitReview();
      $('#save-intent').click();
      $('#jd-entry')?.scrollIntoView({ block: 'nearest' });
    }
  };

  drawText();
  renderDocumentMode();
  updateControls();
  area.scrollTop = 0;
  area.querySelector('#exit-review').focus({ preventScroll: true });
  sourceStatus.textContent = demo ? '演示档案 · 按简历文字显示。' : '尚未关联原件时仅显示文字重排稿，不代表原 PDF 版式。';
  if (!demo) originalResume(source).then(file => {
    if (file && live() && !originalFile) present(file);
    else if (live() && !originalFile) {
      exportReady = true;
      documentMode = 'text_draft';
      renderDocumentMode(true, '未关联原始文件，只能生成重排版内容草稿。');
      print.textContent = '导出';
      print.title = '未关联原文件；此导出不保留原始图片和版式';
      updateControls();
      sourceGate.querySelector('strong').textContent = '原始文件未关联';
      sourceGate.querySelector('span').textContent = '当前是文字重排预览，因此不会出现 PDF 中的头像和装饰。请重新关联原 PDF。';
    }
  }).catch(() => {});
  const observer = new ResizeObserver(() => {
    if (!live()) observer.disconnect();
    else if (!area.hidden) {
      area.style.setProperty('--review-header-height', header.offsetHeight + 'px');
      if (panel.hidden) {
        if (kind === 'docx') resizeWord?.();
        if (kind === 'text') drawText();
      }
    }
  });
  observer.observe(header);
  observer.observe(area.querySelector('.review-paper-column'));
  area.querySelector('#review-pdf').onchange = async event => {
    const file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    const extension = file.name.split('.').pop().toLowerCase();
    if (!['pdf', 'docx'].includes(extension) || file.size > 10 * 1024 * 1024) {
      sourceStatus.textContent = '请选择不超过 10 MB 的原 PDF 或 DOCX。';
      return;
    }
    const request = ++sequence;
    try {
      const extracted = (await readResumeFile(file, extension)).trim();
      if (request !== sequence || !live()) return;
      if (normalize(extracted) !== normalize(source)) {
        sourceStatus.textContent = '原件与当前档案文字不一致。若要切换版本，请从档案页导入。';
        return;
      }
      await originalResume(source, file).catch(() => {});
      if (request === sequence && live()) await present(file);
    } catch {
      if (request === sequence && live()) sourceStatus.textContent = '无法读取该原件。';
    }
  };
}

function paperBlock(block, interactive, active) {
  const wrapper = document.createElement('div');
  wrapper.className = 'paper-block';
  for (const line of block.text.split(/\r?\n/).filter(text => text.trim())) {
    const heading = ['岗位相关经历', '补充经历'].includes(line.trim()) || HEADINGS.some(([, pattern]) => {
      const match = line.normalize('NFKC').trim().match(pattern);
      return match && !match[1];
    });
    const element = document.createElement(heading ? 'h2' : 'p');
    element.textContent = line;
    wrapper.append(element);
  }
  if (interactive && block.mark) {
    wrapper.dataset.change = block.index;
    wrapper.dataset.review = block.mark;
    wrapper.tabIndex = 0;
    wrapper.setAttribute('role', 'button');
    wrapper.setAttribute('aria-current', String(block.index === active));
  }
  return wrapper;
}

function paginateResume(lines, marked = new Set(), original = []) {
  const blocks = lines.map((text, index) => ({
    index, text: text || (marked.has(index) ? original[index] : ''),
    mark: marked.has(index) ? (text.trim() ? 'pending' : 'removed') : ''
  }));
  const summary = blocks.shift();
  const firstSection = blocks.findIndex(block => HEADINGS.some(([, pattern]) => pattern.test(block.text.normalize('NFKC').trim())));
  if (summary.text.trim()) blocks.splice(Math.max(0, firstSection), 0, summary);
  const measure = document.createElement('div');
  measure.className = 'paper paper-measure';
  document.body.append(measure);
  const style = getComputedStyle(measure);
  const limit = measure.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom) - 1;
  const pages = [[]];
  let used = 0;
  for (const block of blocks.filter(item => item.text.trim())) {
    const node = paperBlock(block, false);
    measure.replaceChildren(node);
    const height = node.getBoundingClientRect().height;
    if (used && used + height > limit) {
      pages.push([]);
      used = 0;
    }
    pages[pages.length - 1].push(block);
    used += height;
  }
  measure.remove();
  return pages;
}

function showPaper(area, pages, active) {
  const top = area.scrollTop;
  const width = Math.max(40, area.clientWidth - 16);
  const scale = width / (210 * 96 / 25.4);
  area.replaceChildren(...pages.map(blocks => {
    const shell = document.createElement('div');
    shell.className = 'paper-shell';
    shell.style.height = width * 297 / 210 + 'px';
    const page = document.createElement('div');
    page.className = 'paper';
    page.style.transform = 'scale(' + scale + ')';
    page.append(...blocks.map(block => paperBlock(block, true, active)));
    shell.append(page);
    return shell;
  }));
  area.scrollTop = top;
}

async function showOriginalPdf(area, file, original, changes, references, origins = [], active = () => area.isConnected) {
  const task = await resumePdfTask(await file.arrayBuffer());
  const indexes = new Map();
  const sourceLines = [];
  original.forEach((text, index) => {
    const key = normalize(text);
    if (key) {
      indexes.set(key, [...(indexes.get(key) ?? []), index]);
      sourceLines.push({ key, index });
    }
  });
  const changed = new Set(changes.map(item => item.index));
  const cited = new Set(origins.length ? origins : (String(references[0] ?? '').match(/\d+/g) ?? []).map(Number));
  try {
    const pdf = await task.promise;
    const pages = document.createDocumentFragment();
    for (let number = 1; number <= pdf.numPages && active(); number++) {
      const page = await pdf.getPage(number);
      const viewport = page.getViewport({ scale: 1500 / page.getViewport({ scale: 1 }).width });
      const frame = document.createElement('div');
      frame.className = 'pdf-page';
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);
      canvas.setAttribute('aria-label', '原简历第 ' + number + ' 页');
      frame.append(canvas);
      await page.render({ canvas, canvasContext: canvas.getContext('2d'), viewport }).promise;
      for (const line of await pdfPageLines(page)) {
        const key = normalize(line.text);
        let index = indexes.get(key)?.[0];
        if (index === undefined && key.length >= 8) {
          const candidates = sourceLines.filter(item => item.key.includes(key) || key.includes(item.key));
          if (candidates.length) index = candidates.sort((a, b) =>
            Math.abs(a.key.length - key.length) - Math.abs(b.key.length - key.length))[0].index;
        }
        const target = changed.has(index) ? index : cited.has(index) && changed.has(0) ? 0 : null;
        if (target === null || !line.items.length) continue;
        const corners = line.items.flatMap(item => {
          const [x, y] = item.transform.slice(4);
          const height = item.height || Math.hypot(item.transform[2], item.transform[3]) || 10;
          return [x, x + item.width].flatMap(left => [y - height * .22, y + height * .82]
            .map(top => viewport.convertToViewportPoint(left, top)));
        });
        const xs = corners.map(point => point[0]);
        const ys = corners.map(point => point[1]);
        const hit = document.createElement('button');
        hit.type = 'button';
        hit.className = 'paper-hit';
        hit.dataset.change = target;
        hit.dataset.sourceLine = index;
        hit.setAttribute('aria-label', '查看原文第 ' + index + ' 行的改动');
        Object.assign(hit.style, { left: Math.min(...xs) / viewport.width * 100 + '%',
          top: Math.min(...ys) / viewport.height * 100 + '%',
          width: (Math.max(...xs) - Math.min(...xs)) / viewport.width * 100 + '%',
          height: (Math.max(...ys) - Math.min(...ys)) / viewport.height * 100 + '%' });
        frame.append(hit);
      }
      pages.append(frame);
      page.cleanup();
    }
    if (active()) area.replaceChildren(pages);
  } finally {
    await task.destroy();
  }
}

function beginPrint(title, cleanup) {
  const previousTitle = document.title;
  document.title = title;
  document.body.classList.add('print-resume');
  window.addEventListener('afterprint', () => {
    document.body.classList.remove('print-resume');
    document.title = previousTitle;
    cleanup();
  }, { once: true });
  window.print();
}

async function printPdfReview(preview) {
  const output = $('#resume-print');
  const imageLoads = [];
  const sheets = [...preview.querySelectorAll('.pdf-page')].map(frame => {
    const sheet = document.createElement('div');
    sheet.className = 'pdf-print-page';
    const image = document.createElement('img');
    image.alt = '';
    image.src = frame.querySelector('canvas').toDataURL('image/png');
    imageLoads.push(image.decode().then(() => {
      if (!image.naturalWidth || !image.naturalHeight) throw new Error('PDF page image is empty');
    }));
    sheet.append(image);
    for (const source of frame.querySelectorAll('.pdf-replacement')) {
      const replacement = document.createElement('div');
      replacement.className = 'pdf-replacement';
      replacement.innerHTML = source.innerHTML;
      for (const property of ['left', 'top', 'width', 'minHeight']) replacement.style[property] = source.style[property];
      sheet.append(replacement);
    }
    return sheet;
  });
  if (!sheets.length) return;
  output.replaceChildren(...sheets);
  await Promise.all(imageLoads);
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  beginPrint('岗位定制简历-原版', () => output.replaceChildren());
}

function printResume(pages) {
  const page = $('#resume-print');
  page.replaceChildren(...pages.map(blocks => {
    const sheet = document.createElement('div');
    sheet.className = 'paper';
    sheet.append(...blocks.map(block => paperBlock(block, false)));
    return sheet;
  }));
  beginPrint('岗位定制简历-重排版', () => page.replaceChildren());
}

function manualJDUpdate(form, app = {}) {
  const data = new FormData(form);
  const jd = data.get('jd').trim();
  if (data.has('analyze-jd') && (!jd || !hasProfile())) {
    form.querySelector('[data-jd-notice]').textContent = !jd ? '先填写 JD，或取消勾选后保存。' : '请先补充档案，或取消勾选后只保存 JD。';
    return null;
  }
  const unchanged = jd === (app.jd ?? '');
  const analysis = data.has('analyze-jd') ? { ...analyzeJD(jd, state.profile), jd } :
    (unchanged ? app.analysis ?? null : null);
  if (analysis && data.has('analyze-jd')) rememberAnalysis(analysis);
  return { jd, analysis, matchScore: analysis ? analysis.total : (unchanged ? app.matchScore ?? null : null) };
}

function checkRequired(form, fields) {
  for (const key of fields) {
    const input = form.elements.namedItem(key);
    if (!input.value.trim()) {

      input.reportValidity();
      input.focus();
      return false;
    }
  }
  return true;
}

    notes: '', ...fields, id: Date.now().toString(36) + Math.random().toString(36).slice(2, 9),
    offer: { salary: 0, costIndex: 0, scores: { cost: 5, ...Object.fromEntries(SK.map(([key]) => [key, 5])) } }

function submitJD(area, result, job, status) {
  const preparation = status === 'intent' ? confirmedPreparation(result) : null;
  const fields = { ...job, status, source: 'jd', jd: result.jd, matchScore: result.total,
    analysis: result, ...(preparation ? { preparation } : {}),
    ...(safeLink(result.applicationUrl) ? { applicationUrl: result.applicationUrl } : {}) };
  const existing = state.applications.find(app => normalize(app.company) === normalize(job.company)
    && normalize(app.role) === normalize(job.role));
  if (!existing) {
    storeApplication(fields);
    return;
  }
  area.innerHTML = `<div class="notice"><p>「${escapeHTML(existing.company)} · ${escapeHTML(existing.role)}」已存在，更新还是新建？</p>
    <p class="m">更新后状态为「${ST[status]}」。</p>
    <div class="actions"><button type="button" data-update>更新已有记录</button><button type="button" data-create>仍然新建</button>
    <button type="button" data-cancel>取消</button></div></div>`;
  const update = area.querySelector('[data-update]');
  update.onclick = () => storeApplication(fields, existing);
  area.querySelector('[data-create]').onclick = () => storeApplication(fields);
  area.querySelector('[data-cancel]').onclick = () => area.replaceChildren();
  update.focus();
}

function confirmedPreparation(result) {
  const task = state.preparation;
  const draft = state.rewrite;
  if (!samePreparation(task, result) || !Array.isArray(task.packet?.evidence) ||
      task.packet.verdict === 'hold' || !samePreparation(draft, result)) return null;
  const original = ['', ...draft.source.split(/\r?\n/)];
  if (draft.edits.length !== original.length || draft.edits.some((value, index) => value !== original[index] && !draft.decisions?.[index])) return null;
  return {
    verdict: task.packet.verdict, summary: task.packet.summary, gaps: task.packet.gaps,
    evidence: task.packet.evidence.map(item => ({ requirement: item.requirement, quote: original[item.line] })),
    ...(task.answer ? { clarification: { requirement: task.askedRequirement, answer: task.answer, confirmed: task.packet.confirmed ?? '' } } : {}),
    reviewed: draft.edits.map((value, index) => draft.decisions?.[index] === 'reject' ? original[index] : value)
  };
}

    <label>月生活成本（k）<input type="number" min="0" step="any" data-score="costIndex" value="${app.offer.costIndex}"></label>
    <label>成本评分（省 = 高）<input type="number" min="0" max="10" step="any" data-score="cost" value="${app.offer.scores.cost}"></label>
    ${SK.map(([key, label]) => `<label>${label}<input type="number" min="0" max="10" step="any" data-score="${key}" value="${app.offer.scores[key]}"></label>`).join('')}
    </div></div>`).join('')}</div>
  <p class="m">按当前所选 Offer 的最高月薪与最低生活成本换算。生活成本留空或为 0 时使用手动评分。</p>`;
  const cards = [...main.querySelectorAll('[data-offer]')];
  main.querySelectorAll('[data-pair]').forEach(select => {
    select.onchange = () => {
      selected[Number(select.dataset.pair)] = allOffers[Number(select.value)].id;
      state.offerPair = selected;
      save();
      renderBalance();
      main.querySelector('[data-pair="' + select.dataset.pair + '"]')?.focus();
    };
  });

  function updateScores() {
    const weights = state.weights;
    const totalWeight = WK.reduce((sum, [key]) => sum + weights[key], 0);
    const maxSalary = Math.max(0, ...offers.map(app => app.offer.salary));
    const minCost = Math.min(...offers.map(app => app.offer.costIndex).filter(cost => cost > 0));
    const scores = offers.map(({ offer }) => {
      const values = {
        ...offer.scores,
        salary: maxSalary ? offer.salary / maxSalary * 10 : 0,
        cost: offer.costIndex > 0 ? minCost / offer.costIndex * 10 : offer.scores.cost
      };
      return totalWeight ? Math.round(WK.reduce((sum, [key]) => sum + weights[key] * values[key], 0) / totalWeight * 10) : 0;
    });
    const ranks = scores.map((_, index) => index).sort((a, b) => scores[b] - scores[a]);
    ranks.forEach((index, rank) => {
      const card = cards[index];
      card.style.order = rank;
      card.querySelector('.sc').textContent = scores[index];
      card.querySelector('.bar i').style.width = scores[index] + '%';
    });
    const angle = Math.max(-14, Math.min(14, ((scores[1] ?? scores[0]) - scores[0]) * 0.6));
    $('#beam').style.transform = `rotate(${angle}deg)`;
  }

  $('#beam-left').textContent = offers[0].company.slice(0, 10);
  $('#beam-right').textContent = offers[1]?.company.slice(0, 10) ?? '';
  main.querySelectorAll('[data-weight]').forEach(input => {
    input.oninput = () => {
      state.weights[input.dataset.weight] = Number(input.value);
      input.nextElementSibling.textContent = input.value;
      save();
      updateScores();
    };
  });
  main.querySelectorAll('[data-score]').forEach(input => {
    input.oninput = () => {
      const offer = offers[input.closest('[data-offer]').dataset.offer].offer;
      const key = input.dataset.score;
      const value = Math.max(0, Number(input.value) || 0);
      if (key === 'salary' || key === 'costIndex') offer[key] = value;
      else offer.scores[key] = Math.min(10, value);
      save();
      updateScores();
    };
    input.onchange = () => {
      const offer = offers[input.closest('[data-offer]').dataset.offer].offer;
      input.value = offer[input.dataset.score] ?? offer.scores[input.dataset.score];
    };
  });
  updateScores();
}

openWorkspace();

</script></body></html>

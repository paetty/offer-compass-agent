<body><div class="w">
<h1>Offer Compass</h1>
<p class="m">从读懂一个 JD，到选出最适合你的 offer。</p>
<div class="workspace-tools">
  <button id="demo-toggle" type="button" disabled>体验演示数据</button>
  <p id="storage-status" class="m" role="status">正在读取档案…</p>
  <button id="retry-save" type="button" hidden>重试保存</button>
  <button id="reload-database" type="button" hidden>加载数据库版本</button>
</div>
<nav hidden>
<button data-t="p" onclick="go('p')">档案</button>
<button data-t="j" onclick="go('j')">JD 分析</button>
<button data-t="a" onclick="go('a')">投递</button>
<button data-t="s" onclick="go('s')">天平</button>
</nav>
<main id="m"></main>
<details id="data-tools" class="data-tools" hidden>
  <summary>备份与迁移</summary>
  <p class="m">从文件模式迁移时，先在原浏览器打开原路径的 HTML 文件并导出备份，再到数据库版导入。</p>
  <div class="actions">
    <button id="export-workspace" type="button" disabled>导出备份</button>
    <button id="import-workspace" type="button" disabled>导入备份</button>
  </div>
  <input id="workspace-file" type="file" accept=".json,application/json" hidden aria-label="选择备份文件">
  <p id="backup-status" class="m" role="status"></p>
</details>
</div>
<article id="resume-print" class="rewrite-print" aria-hidden="true"></article>
<script>
const $ = selector => document.querySelector(selector);
const main = $('#m');
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, char =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
const normalize = value => String(value ?? '').normalize('NFKC').toLowerCase()
  .replace(/([\p{Script=Han}])\s+(?=[\p{Script=Han}])/gu, '$1').replace(/\s+/g, ' ').trim();
const splitList = value => [...new Set(value.split(/[,，、;\n；]+/).map(part => part.trim()).filter(Boolean))];
const K = ['专业技能', '工具与方法', '行业经验', '软技能', '学历与语言'];
const GROUPS = {
  education: '教育背景', skills: '技能工具', abilities: '能力',
  projects: '项目经历', experience: '实习／工作经历', honors: '荣誉奖项'
};
const PREFERENCES = { roles: '岗位', industries: '行业', cities: '城市' };
const ST = { intent: '意向', applied: '已投递', interview: '面试中', offer: '拿到 offer', rejected: '已拒绝' };
const WK = [['salary', '薪资'], ['city', '城市'], ['cost', '生活成本'], ['growth', '成长空间'], ['stability', '稳定性'], ['interest', '个人兴趣']];
const SK = WK.filter(([key]) => key !== 'salary' && key !== 'cost');

// 每行第一个词为统一标签，其余为同义词。
const DICT = [
  [
    ['数据分析', 'data analysis', '数据洞察'], ['产品设计', 'product design', '原型设计'],
    ['需求分析', '需求梳理', 'requirements analysis'], ['用户研究', '用户访谈', 'user research'],
    ['商业化', 'monetization'], ['增长', '用户增长', 'growth'], ['运营', 'operations'],
    ['策略', 'strategy'], ['算法', 'algorithm'], ['项目管理', 'project management'],
    ['软件开发', '软件工程', 'software development'], ['接口开发', 'api 开发', 'rest api'],
    ['测试', '软件测试', '测试用例', 'software testing'], ['机器学习', 'machine learning'],
    ['渗透测试', 'penetration testing', 'pentest'], ['应急响应', 'incident response'],
    ['内容创作', '文案策划', 'copywriting'], ['用户运营', '社群运营'],
    ['交互设计', 'ux design', 'interaction design'], ['视觉设计', 'ui design', '平面设计'],
    ['招聘', '人才招聘', 'recruitment'], ['市场调研', 'market research']
  ],
  [
    ['SQL', 'MySQL', 'PostgreSQL', 'SQLite'], ['Python', 'Pandas', 'NumPy'],
    ['Axure'], ['Figma'], ['Excel', '电子表格'], ['A/B 测试', 'a/b', 'ab 测试', 'ab testing'],
    ['PRD', '产品需求文档'], ['埋点', '事件追踪'], ['Tableau'], ['数据看板', '仪表盘', 'dashboard'],
    ['Java', 'Spring Boot'], ['JavaScript', 'TypeScript', 'JS', 'TS'], ['Git', 'GitHub'],
    ['Linux', 'Ubuntu'], ['Docker', '容器化'], ['Wireshark'], ['Burp Suite', 'Burp'],
    ['Photoshop', 'PS'], ['Power BI', 'PowerBI'], ['HTML', 'HTML5'], ['CSS', 'CSS3'], ['Vue', 'Vue.js'], ['React', 'React.js']
  ],
  [
    ['广告', '数字营销', 'advertising'], ['电商', '电子商务', 'e-commerce', 'ecommerce'],
    ['社区', '内容社区'], ['金融', '银行', '证券', '保险', 'fintech'], ['医疗', '医药', 'healthcare'],
    ['教育', '教培', 'edtech'], ['游戏', 'gaming'], ['互联网', 'internet'], ['SaaS', '企业软件'],
    ['AI', '人工智能', '大模型', 'artificial intelligence'], ['网络安全', '信息安全', 'cybersecurity'],
    ['制造业', '智能制造'], ['新能源', '新能源汽车'], ['物流', '供应链']
  ],
  [
    ['沟通', '表达', 'communication'], ['协作', '团队合作', '团队', 'collaboration', 'teamwork'],
    ['推动', '推进', '执行力'], ['逻辑', '逻辑思维', '结构化思维'], ['学习能力', '快速学习', '自学'],
    ['责任心', '责任感'], ['抗压', '抗压能力'], ['问题解决', '解决问题', 'problem solving']
  ],
  [
    ['本科', '学士', 'bachelor'], ['硕士', '研究生', 'master'], ['博士', 'phd'],
    ['大专', '专科'], ['英语', '英文', 'CET-4', 'CET-6', 'english'], ['日语', '日文', 'japanese'],
    ['韩语', '韩文', 'korean'], ['法语', '法文', 'french'], ['德语', '德文', 'german'],
    ['西班牙语', '西语', 'spanish'], ['普通话', '中文', 'mandarin'], ['计算机', 'computer science'],
    ['统计', '统计学', 'statistics'], ['数据科学', 'data science'], ['应届生', '应届毕业生']
  ]
];
const HONORS = [
  ['奖学金', 'scholarship'], ['一等奖', '金奖'], ['二等奖', '银奖'], ['三等奖', '铜奖'],
  ['优秀毕业生'], ['优秀学生干部'], ['竞赛获奖', '大赛获奖']
];
const SECTION_HEADINGS = {
  education: '教育背景|教育经历|学历背景|教育|education',
  skills: '专业技能|技能工具|技能证书|技能清单|技能|technical skills|skills',
  abilities: '核心能力|个人能力|能力|competencies',
  projects: '项目经历|项目经验|项目实践|项目|projects|project experience',
  experience: '实习\\/工作经历|实习经验|实习经历|工作经历|工作经验|实习|工作|experience|internship|work experience',
  honors: '荣誉\\/奖项|获奖经历|荣誉奖项|获奖情况|奖项|荣誉|awards|honors',
  other: '自我评价|个人简介|个人总结|求职意向|求职偏好|自我介绍|summary|objective'
};
const HEADINGS = Object.entries(SECTION_HEADINGS).map(([key, labels]) =>
  [key, new RegExp('^(?:' + labels + ')(?:(?:\\s*:\\s*|\\s+)(.*)|$)', 'iu')]);
const quotePattern = text => text.replace(/[.*+?^$\x7b\x7d()|[\]\\]/g, '\\$&');
const keywordPattern = aliases => new RegExp(aliases.map(alias => {
  const term = normalize(alias);
  return (/^[a-z0-9]/.test(term) ? '(?<![a-z0-9])' : '') + quotePattern(term)
    + (/[a-z0-9]$/.test(term) ? '(?![a-z0-9])' : '');
}).join('|'), 'u');
const TERMS = [...DICT.flat(), ...HONORS];
const ALIASES = new Map(TERMS.flatMap(aliases => aliases.map(alias => [normalize(alias), aliases[0]])));
const TERM_PATTERNS = new Map(TERMS.map(aliases => [aliases[0], keywordPattern(aliases)]));
const HONOR_WORDS = new Set(HONORS.map(([word]) => word));
const LANGUAGES = new Set(['英语', '日语', '韩语', '法语', '德语', '西班牙语', '普通话']);
const EDUCATION_FACTS = new Set(DICT[4].map(([word]) => word).filter(word => !LANGUAGES.has(word)));
const TOOLS = new Set([...DICT[0], ...DICT[1]].map(([word]) => word));
const LEVELS = ['待确认', '了解', '熟练', '精通'];
const LEVEL_WORDS = [
  [3, '精通|专家级|母语(?:水平)?|\\b(?:expert|native)\\b'],
  [2, '熟练(?:使用|掌握|运用)?|熟悉|流利|\\b(?:proficien(?:t|cy)|fluent)\\b'],
  [1, '了解|入门|基础|\\b(?:familiar(?:ity)?|basic)\\b']
];
const emptyKeywords = () => Object.fromEntries(Object.keys(GROUPS).map(key => [key, []]));
const canonical = word => ALIASES.get(normalize(word)) ?? word.trim();

function statedLevel(text, pattern) {
  const words = pattern.source;
  for (const [level, terms] of LEVEL_WORDS) {
    const cue = '(?:' + terms + ')';
    const before = new RegExp(cue + '(?:\\s*(?:with|in|of|于|使用|掌握|运用))?\\s*(?:' + words + ')', 'u');
    const after = new RegExp('(?:' + words + ')\\s*(?:[:：]\\s*)?' + cue, 'u');
    if (before.test(text) || after.test(text)) return level;
  }
  return 0;
}

function gradedSkills(profile) {
  const result = new Map();
  for (const [group, items] of Object.entries(profile.keywords)) {
    if (group === 'honors') continue;
    for (const item of items) {
      const word = canonical(item.word);
      if (TOOLS.has(word) || LANGUAGES.has(word) || (group === 'skills' && !TERM_PATTERNS.has(word))) {
        result.set(normalize(word), word);
      }
    }
  }
  return result;
}

function resumeLevels(profile) {
  const levels = new Map();
  const lines = Object.entries(resumeSections(profile.resumeText))
    .flatMap(([group, content]) => group === 'honors' ? [] : content).map(normalize);
  for (const [key, word] of gradedSkills(profile)) {
    const pattern = TERM_PATTERNS.get(word) ?? keywordPattern([word]);
    const level = lines.reduce((best, line) => Math.max(best, statedLevel(line, pattern)), 0);
    levels.set(key, profile.levels?.[key] ?? level);
  }
  return levels;
}

function keywordEvidence(section, word) {
  return section === 'projects' || section === 'experience' ||
    (section === 'education' && EDUCATION_FACTS.has(word)) ? 'strong' : 'weak';
}

function resumeSections(text) {
  const sections = { ...Object.fromEntries(Object.keys(GROUPS).map(key => [key, []])), other: [] };
  let current = 'other';
  for (const line of text.split(/\r?\n/)) {
    const content = line.normalize('NFKC').trim().replace(/^(?:#{1,6}\s+|[一二三四五六七八九\d]+[.、]\s*|[【[])/u, '').replace(/[】\]](?=\s*[:]|$)/u, '');
    const heading = HEADINGS.map(([key, re]) => [key, content.match(re)]).find(([, match]) => match);
    if (heading) {
      current = heading[0];
      if (heading[1][1]) sections[current].push(heading[1][1]);
    } else if (content) {
      sections[current].push(content);
    }
  }
  return sections;
}

function extractKeywords(text) {
  const keywords = emptyKeywords();
  for (const [section, lines] of Object.entries(resumeSections(text))) {
    const content = normalize(lines.join('\n'));
    for (const [word, pattern] of TERM_PATTERNS) {
      if (!pattern.test(content)) continue;
      const group = section === 'honors' || HONOR_WORDS.has(word) ? 'honors' : section === 'other'
        ? (DICT[4].some(([key]) => key === word) ? 'education' : DICT[3].some(([key]) => key === word) ? 'abilities' : 'skills')
        : section;
      if (keywords[group].some(item => item.word === word)) continue;
      const evidence = group === 'honors' ? 'weak' : keywordEvidence(section, word);
      keywords[group].push({ word, evidence, source: 'auto' });
    }
    if (section === 'honors') {
      for (const line of lines) {
        const word = line.replace(/^[-•·]\s*/, '').trim();
        if (word && !keywords.honors.some(item => normalize(item.word) === normalize(word))) {
          keywords.honors.push({ word, evidence: 'weak', source: 'auto' });
        }
      }
    }
  }
  return keywords;
}

function updateResume(text, replace = false) {
  const profile = state.profile;
  const extracted = extractKeywords(text);
  const previous = replace ? emptyKeywords() : extractKeywords(profile.resumeText);
  for (const key of Object.keys(GROUPS)) {
    const edited = replace ? [] : profile.keywords[key];
    const manual = edited.filter(item => item.source === 'manual');
    const has = (items, word) => items.some(item => normalize(item.word) === normalize(word));
    const removed = previous[key].filter(item => !has(edited, item.word));
    extracted[key] = [...extracted[key].filter(item => !has(removed, item.word) && !has(manual, item.word)), ...manual];
  }
  profile.resumeText = text;
  profile.keywords = extracted;
  state.lastAnalysis = null;
  save();
}

function readLocal(key) {
  try { return JSON.parse(localStorage.getItem(key)); }
  catch { return null; }
}

function normalizeWorkspace(stored) {
  const data = stored ?? {};
  const old = data.profile ?? {};
  const savedResume = old.resumeText ?? old.resume;
  const resumeText = typeof savedResume === 'string' ? savedResume : '';
  const keywords = extractKeywords(resumeText);
  for (const key of Object.keys(GROUPS)) {
    if (Array.isArray(old.keywords?.[key])) {
      const extracted = keywords[key];
      keywords[key] = old.keywords[key].filter(item => typeof item?.word === 'string' && item.word.trim()).map(item => {
        const word = canonical(item.word);
        if (key !== 'education' || !EDUCATION_FACTS.has(word)) return item;
        const evidence = item.source === 'manual' ? keywordEvidence(key, word) :
          extracted.find(tag => tag.word === word)?.evidence ?? 'weak';
        return { ...item, evidence };
      });
    }
  }
  if (typeof old.skills === 'string' && !old.keywords) {
    for (const label of splitList(old.skills)) {
      const word = canonical(label);
      if (!keywords.skills.some(item => normalize(item.word) === normalize(word))) {
        keywords.skills.push({ word, evidence: 'weak', source: 'manual' });
      }
    }
  }
  const savedApplications = data.applications ?? data.apps;
  const applications = Array.isArray(savedApplications) ? savedApplications.filter(app => typeof app?.company === 'string') : [];
  const usedIds = new Set();
  return {
    profile: { resumeText, keywords,
      levels: Object.fromEntries(Object.entries(old.levels ?? {}).filter(([, level]) => [0, 1, 2, 3].includes(level))),
      jobBoard: normalizeJobBoard(old.jobBoard),
      preferences: Object.fromEntries(Object.keys(PREFERENCES).map(key =>
      [key, Array.isArray(old.preferences?.[key]) ? old.preferences[key].filter(value => typeof value === 'string' && value.trim()) : []])) },
    applications: applications.map((app, index) => {
      let id = typeof app.id === 'string' && app.id ? app.id : 'legacy-' + index;
      while (usedIds.has(id)) id += '-copy';
      usedIds.add(id);
      return {
        ...app, id, source: app.source ?? (app.jd ? 'jd' : 'manual'),
        industry: app.industry ?? '', notes: app.notes ?? '',
        matchScore: Number.isFinite(app.matchScore) ? app.matchScore : null,
        offer: {
          salary: numericValue(app.offer?.salary, 0),
          costIndex: numericValue(app.offer?.costIndex, 0),
          scores: Object.fromEntries(WK.filter(([key]) => key !== 'salary').map(([key]) =>
            [key, numericValue((app.offer?.scores ?? app.offer?.s)?.[key], 5, 10)]))
        }
      };
    }),
    weights: Object.fromEntries(WK.map(([key]) => [key, numericValue(data.weights?.[key], 5, 10)])),
    jdDraft: typeof data.jdDraft === 'string' ? data.jdDraft : '',
    lastAnalysis: validAnalysis(data.lastAnalysis, data.jdDraft) ? data.lastAnalysis : null,
    analyses: Array.isArray(data.analyses) ? data.analyses.filter(result => validAnalysis(result, result?.jd)) : [],
    jobLink: typeof data.jobLink?.jd === 'string' && safeLink(data.jobLink.url) ? data.jobLink : null,
    rewrite: data.rewrite && typeof data.rewrite.jd === 'string' && typeof data.rewrite.source === 'string'
      && Array.isArray(data.rewrite.edits) && data.rewrite.edits.every(edit => typeof edit === 'string') ? {
        ...data.rewrite, decisions: Object.fromEntries(Object.entries(data.rewrite.decisions ?? {})
          .filter(([key, decision]) => /^\d+$/.test(key) && ['accept', 'reject'].includes(decision))),
        origins: Array.isArray(data.rewrite.origins) ? data.rewrite.origins.filter(Number.isInteger) : []
      } : null,
    preparation: data.preparation && typeof data.preparation.jd === 'string' && typeof data.preparation.source === 'string'
      && ['local', 'model'].includes(data.preparation.mode) ? data.preparation : null,
    offerPair: Array.isArray(data.offerPair) ? data.offerPair.filter(id => typeof id === 'string').slice(0, 2) : []
  };
}

function numericValue(value, fallback, max = Infinity) {
  return Number.isFinite(value) ? Math.min(max, Math.max(0, value)) : fallback;
}

function validAnalysis(result, draft) {
  return typeof draft === 'string' && result?.jd === draft.trim()
    && Array.isArray(result.dims) && result.dims.length === K.length
    && result.dims.every(value => value === null || Number.isFinite(value))
    && (result.total === null || Number.isFinite(result.total))
    && result.job && Array.isArray(result.gaps) && result.gaps.every(gap => typeof gap?.w === 'string')
    && Array.isArray(result.tips) && result.tips.every(tip => typeof tip?.from === 'string');
}

const databaseMode = location.protocol === 'http:' && location.hostname === '127.0.0.1' && location.pathname === '/';
const pendingKey = 'oc-db-pending';
let state;
let personalState;
let demoState;
let demo = false;
let ready = false;
let tab;
let showRecommendations = false;
let parseRevision = 0;
let applicationNotice = '';
let revision = 0;
let pending = null;
let inFlight = null;
let lastAttempt = null;
let saveTimer;
let conflict = false;
let databaseStatus = '已连接本地数据库';
let retryVisible = false;

function renderStorageStatus() {
  $('#storage-status').textContent = demo ? '演示模式 · 这里的改动仅用于体验。' : databaseStatus;
  $('#retry-save').hidden = demo || !retryVisible;
  $('#reload-database').hidden = demo || !conflict;
  $('#data-tools').hidden = demo || !ready;
}

function rememberPending() {
  try { localStorage.setItem(pendingKey, JSON.stringify(pending)); }
  catch {}
}

function clearPending(update) {
  try {
    if (readLocal(pendingKey)?.id === update.id) localStorage.removeItem(pendingKey);
  } catch {}
}

function save() {
  if (demo) return;
  if (!databaseMode) {
    try {
      localStorage.setItem('oc', JSON.stringify(state));
      databaseStatus = '已保存到当前浏览器。使用启动脚本可进入数据库版。';
    } catch {
      databaseStatus = '浏览器保存失败。关闭页面前可导出备份。';
    }
    renderStorageStatus();
    return;
  }
  pending = {
    id: crypto.randomUUID(), revision, after: inFlight?.id ?? lastAttempt?.id ?? pending?.after ?? null,
    data: JSON.parse(JSON.stringify(state))
  };
  rememberPending();
  if (!conflict) {
    databaseStatus = '正在保存到本地数据库…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushWorkspace, 250);
  }
  renderStorageStatus();
}

async function flushWorkspace() {
  if (!pending || inFlight || conflict) return;
  const update = inFlight = lastAttempt = pending;
  let saved = false;
  try {
    const body = JSON.stringify(update);
    const response = await fetch('/api/workspace', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body,
      keepalive: new Blob([body]).size < 60 * 1024
    });
    if (response.status === 409) {
      markConflict();
      return;
    }
    if (!response.ok) throw new Error('Save failed');
    revision = (await response.json()).revision;
    saved = true;
    lastAttempt = null;
    retryVisible = false;
    if (pending.id === update.id) {
      clearPending(update);
      pending = null;
      databaseStatus = '已保存到本地数据库';
    } else {
      pending.revision = revision;
      pending.after = null;
      rememberPending();
    }
  } catch {
    retryVisible = true;
    databaseStatus = '本地数据库暂未保存。请确认启动窗口仍在运行，然后重试。';
  } finally {
    inFlight = null;
    renderStorageStatus();
    if (saved && pending) flushWorkspace();
  }
}

function markConflict() {
  conflict = true;
  retryVisible = false;
  databaseStatus = '数据库已被另一个页面更新。可导出此页备份，再加载数据库版本。';
}

async function readDatabase() {
  const response = await fetch('/api/workspace', { cache: 'no-store' });
  if (!response.ok) throw new Error('Read failed');
  return response.json();
}

async function openWorkspace() {
  try {
    if (databaseMode) {
      const saved = await readDatabase();
      revision = saved.revision;
      const queued = readLocal(pendingKey);
      if (queued?.id && queued.id === saved.id) clearPending(queued);
      else if (queued?.id && queued.data) {
        pending = queued;
        if (queued.revision !== revision && (!saved.id || queued.after !== saved.id)) markConflict();
        else databaseStatus = '正在恢复上次的改动…';
      }
      state = normalizeWorkspace(pending?.data ?? saved.data);
    } else {
      state = normalizeWorkspace(readLocal('oc'));
      databaseStatus = '当前为 HTML 文件模式。使用启动脚本可进入数据库版。';
    }
    personalState = state;
    ready = true;
    $('nav').hidden = false;
    for (const id of ['demo-toggle', 'export-workspace', 'import-workspace']) $('#' + id).disabled = false;
    renderStorageStatus();
    go(state.jdDraft ? 'j' : 'p');
    if (pending && !conflict) flushWorkspace();
  } catch {
    databaseStatus = '无法读取本地数据库。请确认启动窗口仍在运行，再刷新页面。';
    renderStorageStatus();
  }
}

$('#retry-save').onclick = flushWorkspace;
$('#reload-database').onclick = async () => {
  if (!window.confirm('加载数据库版本会放弃本页未保存的修改。已导出备份后再继续。')) return;
  try {
    const saved = await readDatabase();
    if (pending) clearPending(pending);
    pending = lastAttempt = null;
    conflict = false;
    revision = saved.revision;
    state = personalState = normalizeWorkspace(saved.data);
    databaseStatus = '已加载本地数据库';
    renderStorageStatus();
    go(tab, true);
  } catch {
    databaseStatus = '读取数据库失败。本页的改动仍可导出。';
    renderStorageStatus();
  }
};

$('#export-workspace').onclick = () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'offer-compass-backup.json';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  $('#backup-status').textContent = '备份包含当前档案、JD 分析、投递记录和天平设置。';
};

$('#import-workspace').onclick = () => $('#workspace-file').click();
$('#workspace-file').onchange = async event => {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const status = $('#backup-status');
  try {
    if (file.size > 32 * 1024 * 1024) throw new Error('Backup too large');
    const data = JSON.parse(await file.text());
    if (!data?.profile || !Array.isArray(data.applications ?? data.apps) || !data.weights) {
      throw new Error('Invalid backup');
    }
    if (demo) return;
    if (conflict) {
      status.textContent = '请先处理数据库版本冲突，再导入备份。';
      return;
    }
    if (!window.confirm('导入备份会替换当前档案、分析、投递和天平设置，继续吗？')) return;
    state = personalState = normalizeWorkspace(data);
    save();
    go(state.jdDraft ? 'j' : 'p', true);
    status.textContent = '已载入备份。';
  } catch {
    status.textContent = '无法读取备份。请选择 Offer Compass 导出的 JSON 文件。';
  }
};

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushWorkspace();
});

function evidenceMap(profile) {
  const evidence = new Map();
  for (const key of Object.keys(GROUPS)) {
    if (key === 'honors') continue;
    for (const item of profile.keywords[key]) {
      const word = normalize(canonical(item.word));
      evidence.set(word, Math.max(evidence.get(word) ?? 0, item.evidence === 'strong' ? 1 : 0.5));
    }
  }
  return evidence;
}

const FAMILIES = [
  ['产品经理', ['需求分析', '产品设计', 'PRD'], ['用户研究', '数据分析', '推动', '沟通']],
  ['数据分析', ['数据分析', 'SQL', 'Python'], ['统计', 'Excel', '数据看板', 'Tableau']],
  ['网络安全', ['网络安全', '渗透测试', '应急响应'], ['Linux', 'Python', 'Wireshark', 'Burp Suite']],
  ['用户与内容运营', ['运营', '用户运营', '内容创作'], ['增长', '数据分析', '社区', '沟通']],
  ['软件开发', ['软件开发', '接口开发', 'Git'], ['Java', 'JavaScript', 'Python', 'SQL', 'Docker']],
  ['视觉与交互设计', ['交互设计', '视觉设计', 'Figma'], ['用户研究', '产品设计', 'Photoshop', '沟通']],
  ['市场营销', ['市场调研', '广告', '内容创作'], ['增长', '策略', '商业化', '数据分析']],
  ['人力资源', ['招聘', '沟通', '协作'], ['项目管理', 'Excel', '推动', '问题解决']]
];

function recommend(profile) {
  const evidence = evidenceMap(profile);
  return FAMILIES.map(([name, core, other]) => {
    const words = [...core, ...other];
    const hit = words.filter(word => evidence.has(normalize(word)));
    const score = words.reduce((sum, word) => sum + (evidence.get(normalize(word)) ?? 0) * (core.includes(word) ? 2 : 1), 0);
    return {
      name, hit, score: Math.round(score / (core.length * 2 + other.length) * 100),
      gaps: words.filter(word => (evidence.get(normalize(word)) ?? 0) < 1)
        .slice(0, 3).map(word => evidence.has(normalize(word)) ? word + '（待补经历）' : word)
    };
  }).sort((a, b) => b.score - a.score).slice(0, 3);
}

const CITY_NAMES = '北京 上海 广州 深圳 杭州 成都 重庆 南京 苏州 武汉 西安 长沙 郑州 合肥 天津 宁波 青岛 济南 厦门 福州 昆明 南昌 东莞 佛山 珠海 无锡 常州 南通 温州 嘉兴 哈尔滨 沈阳 大连 长春 石家庄 太原 海口 三亚 贵阳 南宁 兰州 乌鲁木齐 香港 澳门 台北 新加坡 远程'.split(' ');
const JD_LABELS = {
  company: '招聘公司|公司名称|用人单位|公司|企业|雇主|company',
  role: '招聘岗位|岗位名称|职位名称|职位|岗位|职务|role|position',
  industry: '所属行业|行业|industry',
  city: '工作城市|工作地点|工作地|工作地址|城市|地点|location|city'
};
const INFO_FIELDS = { company: '公司', role: '岗位', industry: '行业', city: '城市' };
const INFO_LINE = new RegExp('(?:^|[\\n;|,，]|\\s+)(?:' + Object.values(JD_LABELS).join('|') + ')\\s*:', 'giu');
const JOB_FIELD_LINE = new RegExp('^(?:' + Object.values(JD_LABELS).join('|') + ')\\s*:', 'iu');

function extractJob(jd) {
  const text = jd.normalize('NFKC');
  const labels = [...text.matchAll(INFO_LINE)];
  const job = {};
  for (const [key, names] of Object.entries(JD_LABELS)) {
    const index = labels.findIndex(label => new RegExp('^(?:' + names + ')\\s*:$', 'iu')
      .test(label[0].replace(/^[;|,，\s]+/, '')));
    const match = labels[index];
    job[key] = match ? text.slice(match.index + match[0].length, labels[index + 1]?.index)
      .split(/[\n;|]/, 1)[0].replace(/[,，]\s*$/, '').trim() : '';
  }
  const first = text.split('\n').find(line => line.trim())?.trim() ?? '';
  if (!job.role && !labels.some(label => label.index === 0) && /工程师|经理|专员|分析师|实习|设计师|顾问|开发岗|运营岗/u.test(first) && first.length <= 60) {
    job.role = first;
  }
  if (!job.city) job.city = CITY_NAMES.filter(city => text.includes(city)).join('、');
  if (!job.industry) {
    const industry = DICT[2].find(([word]) => TERM_PATTERNS.get(word).test(normalize(text)));
    job.industry = industry?.[0] ?? '';
  }
  return job;
}

function scoringTerms(profile) {
  const customSkills = [...gradedSkills(profile).values()].filter(word => !TERM_PATTERNS.has(word));
  return DICT.map((terms, index) => [...terms, ...(index === 1 ? customSkills.map(word => [word]) : [])]);
}

function jdRequirements(jd, job, patterns) {
  const requirements = new Map();
  const optional = /优先|加分|了解|preferred|nice to have|bonus/iu;
  const required = /必备|必须|熟悉|要求|required|must/iu;
  let defaultWeight = 1;
  for (const raw of jd.normalize('NFKC').split(/\r?\n/)) {
    const line = raw.trim().replace(/^[-•·]\s*/, '');
    if (!line || JOB_FIELD_LINE.test(line) || line === job.role) continue;
    if (/^(?:加分项|优先条件|任职要求|岗位要求|招聘要求|技能要求|职位要求|职责|岗位职责|必备条件|preferred|required)\s*(?::|$)/iu.test(line)) {
      defaultWeight = optional.test(line.split(':')[0]) ? 0.5 : 1;
    }
    let clauseWeight = defaultWeight;
    for (const clause of line.split(/[。；;，,！？!?]/u)) {
      if (optional.test(clause)) clauseWeight = 0.5;
      else if (required.test(clause)) clauseWeight = 1;
      const content = normalize(clause);
      const cues = LEVEL_WORDS.filter(([, terms]) => new RegExp(terms, 'u').test(content));
      const occurrences = [...patterns].flatMap(([word, pattern]) =>
        [...content.matchAll(new RegExp(pattern.source, 'gu'))].map(match =>
          ({ word, start: match.index, end: match.index + match[0].length })));
      const distinct = new Set(occurrences.filter(item => !occurrences.some(other => other.word !== item.word
        && other.start <= item.start && other.end >= item.end
        && other.end - other.start > item.end - item.start)).map(item => item.word));
      for (const [word, pattern] of patterns) {
        if (!distinct.has(word)) continue;
        const level = statedLevel(content, pattern) || (cues.length === 1 ? cues[0][0] : 0);
        const previous = requirements.get(word);
        if (!previous || previous.weight < clauseWeight) requirements.set(word, { weight: clauseWeight, level });
        else if (previous.weight === clauseWeight) previous.level = Math.max(previous.level, level);
      }
    }
  }
  return requirements;
}

// 固定分析接口供后续替换。null 表示该维度或整份 JD 没有可识别的要求。
function analyzeJD(jd, profile) {
  const job = extractJob(jd);
  const evidence = evidenceMap(profile);
  const dimensions = scoringTerms(profile);
  const patterns = new Map(dimensions.flat().map(([word]) => [word, TERM_PATTERNS.get(word) ?? keywordPattern([word])]));
  const requirements = jdRequirements(jd, job, patterns);
  const levels = resumeLevels(profile);
  const gaps = [];
  const dims = dimensions.map((terms, index) => {
    let sum = 0;
    let possible = 0;
    for (const [word] of terms) {
      const requirement = requirements.get(word);
      if (!requirement) continue;
      const { weight } = requirement;
      const key = normalize(word);
      const proof = evidence.get(key) ?? 0;
      const graded = TOOLS.has(word) || LANGUAGES.has(word) || levels.has(key);
      const target = graded ? requirement.level || (weight === 1 ? 2 : 1) : 0;
      const actual = levels.get(key) ?? 0;
      const strength = target && proof ? (actual ? Math.min(1, actual / target) : Math.min(.75, proof)) : proof;
      possible += weight;
      sum += weight * strength;
      if (strength < 1) gaps.push({ w: word, dim: K[index], weight, strength, target, actual });
    }
    return possible ? sum / possible * 100 : null;
  });
  const scored = dims.filter(score => score !== null);
  const total = scored.length ? Math.round(scored.reduce((sum, value) => sum + value, 0) / scored.length) : null;
  gaps.sort((a, b) => b.weight - a.weight || a.strength - b.strength);
  const honor = profile.keywords.honors[0];
  const lines = Object.entries(resumeSections(profile.resumeText ?? ''))
    .flatMap(([section, content]) => section === 'honors' ? [] : content);
  const tips = gaps.slice(0, honor ? 4 : 5).map(gap => {
    const original = gap.strength && lines.find(line => patterns.get(gap.w).test(normalize(line)));
    const academic = EDUCATION_FACTS.has(gap.w);
    return {
      from: original ? original.slice(0, 90) + (original.length > 90 ? '…' : '') :
        gap.strength ? '仅有「' + gap.w + '」关键词' : '档案中未识别到「' + gap.w + '」',
      to: academic ? '如符合要求，请在教育背景中写明相应的学历、专业或毕业时间。' :
        gap.target && gap.strength ? '核对档案中的「' + gap.w + '」等级，并用实际经历或证书说明熟练程度。' :
        '如有真实经历，可写成「在〔项目或实习〕中用' + gap.w + '完成〔任务〕，取得〔结果〕」。',
      why: (gap.weight === 1 ? '必备' : '加分') + ' · ' + gap.dim +
        (academic ? ' · 教育背景中缺少对应信息' : gap.target ? ' · 岗位等级 ' + LEVELS[gap.target] : ' · 当前缺少项目或实习证据')
    };
  });
  if (honor) tips.push({
    from: '档案亮点 · ' + honor.word,
    to: '可放在「荣誉奖项」小节。若与项目直接相关，也可补充在该项目条目后。',
    why: '让奖项和对应经历更容易找到。'
  });
  return { dims: dims.map(score => score === null ? null : Math.round(score)), total, gaps: gaps.slice(0, 8), tips, job };
}

const PDF_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.4.299/';
const DOCX_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.13.0/mammoth.browser.min.js';
const PARSE_ERROR = '未能读取文字，请改用粘贴文本';
const parserLoads = new Map();

function loadParser(url, globalName, type) {
  if (window[globalName]) return Promise.resolve(window[globalName]);
  if (!parserLoads.has(url)) {
    const pending = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      const finish = () => {
        clearTimeout(timer);
        script.remove();
        const library = window[globalName];
        if (library) resolve(library);
        else reject(new Error(PARSE_ERROR));
      };
      const timer = setTimeout(finish, 10000);
      if (type) script.type = type;
      script.src = url;
      script.onload = finish;
      script.onerror = finish;
      document.head.append(script);
    }).finally(() => parserLoads.delete(url));
    parserLoads.set(url, pending);
  }
  return parserLoads.get(url);
}

async function readResumeFile(file, extension) {
  const data = await file.arrayBuffer();
  if (extension === 'docx') {
    const mammoth = await loadParser(DOCX_CDN, 'mammoth');
    return (await mammoth.extractRawText({ arrayBuffer: data })).value;
  }
  const task = await resumePdfTask(data);
  try {
    const pdf = await task.promise;
    const pages = [];
    for (let index = 1; index <= pdf.numPages; index++) {
      const page = await pdf.getPage(index);
      pages.push((await pdfPageLines(page)).map(line => line.text).join('\n'));
      page.cleanup();
    }
    return pages.join('\n').normalize('NFKC');
  } finally {
    await task.destroy();
  }
}

async function resumePdfTask(data) {
  const pdfjs = await loadParser(PDF_CDN + 'pdf.min.mjs', 'pdfjsLib', 'module');
  pdfjs.GlobalWorkerOptions.workerSrc = PDF_CDN + 'pdf.worker.min.mjs';
  return pdfjs.getDocument({ data, isEvalSupported: false, useWasm: false, verbosity: 0 });
}

async function pdfPageLines(page) {
  const content = await page.getTextContent();
  const lines = [{ text: '', items: [] }];
  let previous;
  for (const item of content.items) {
    if (typeof item.str !== 'string') continue;
    let current = lines[lines.length - 1];
    if (previous && !previous.hasEOL && item.str) {
      const [x, y] = item.transform.slice(4);
      const [lastX, lastY] = previous.transform.slice(4);
      if (Math.abs(y - lastY) > 3) {
        current = { text: '', items: [] };
        lines.push(current);
      } else if (x - lastX - previous.width > 1) current.text += ' ';
    }
    current.text += item.str;
    if (item.str.trim()) current.items.push(item);
    if (item.hasEOL) lines.push({ text: '', items: [] });
    previous = item;
  }
  return lines;
}

async function originalResume(source, file) {
  const db = await new Promise((resolve, reject) => {
    const request = indexedDB.open('offer-compass-resume', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('original');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  try {
    return await new Promise((resolve, reject) => {
      const transaction = db.transaction('original', file ? 'readwrite' : 'readonly');
      const store = transaction.objectStore('original');
      const request = file ? store.put({ source, file }, 'resume') : store.get('resume');
      transaction.oncomplete = () => resolve(file || (request.result?.source === source ? request.result.file : null));
      transaction.onerror = () => reject(transaction.error);
      transaction.onabort = () => reject(transaction.error);
    });
  } finally {
    db.close();
  }
}

function normalizeJobBoard(board) {
  if (!board || typeof board.token !== 'string' || !/^[a-z0-9_-]{1,80}$/i.test(board.token)) return null;
  return { token: board.token, company: String(board.company ?? '').trim(), industry: String(board.industry ?? '').trim() };
}

function boardToken(value) {
  if (/^[a-z0-9_-]{1,80}$/i.test(value)) return value;
  try {
    const url = new URL(value);
    if (url.protocol === 'https:' && ['boards.greenhouse.io', 'job-boards.greenhouse.io'].includes(url.hostname)) {
      return url.pathname.split('/')[1];
    }
  } catch {}
  return '';
}

function safeLink(value) {
  try {
    const url = new URL(value);
    if (url.protocol === 'https:') return url.href;
  } catch {}
  return '';
}

function jobDescription(html) {
  const element = document.createElement('template');
  if (typeof html !== 'string') return '';
  if (html.includes('&lt;')) {
    element.innerHTML = html;
    html = element.content.textContent;
  }
  element.innerHTML = html.replace(/<(?:br\s*\/?|\/(?:p|li|div|h[1-6]|ul|ol))\s*>/gi, '$&\n');
  element.content.querySelectorAll('script,style').forEach(node => node.remove());
  return element.content.textContent.replace(/\n{3,}/g, '\n\n').trim();
}

const boardCache = new Map();

async function readBoard(token) {
  const response = await fetch('https://boards-api.greenhouse.io/v1/boards/' + encodeURIComponent(token) + '/jobs?content=true',
    { credentials: 'omit', referrerPolicy: 'no-referrer', signal: AbortSignal.timeout(10000) });
  if (!response.ok) throw new Error('招聘来源返回 ' + response.status);
  const data = await response.json();
  if (!Array.isArray(data.jobs)) throw new Error('招聘来源返回的数据格式有误');
  return data.jobs.filter(job => typeof job?.title === 'string' && safeLink(job.absolute_url)).map(job => ({
    role: job.title, city: job.location?.name ?? '', jd: jobDescription(job.content), url: safeLink(job.absolute_url)
  }));
}

function matchesPreferences(job, preferences) {
  const equivalents = {
    '北京': 'beijing', '上海': 'shanghai', '广州': 'guangzhou', '深圳': 'shenzhen',
    '杭州': 'hangzhou', '成都': 'chengdu', '香港': 'hong kong', '远程': 'remote',
    '产品经理': 'product manager', '数据分析师': 'data analyst', '工程师': 'engineer',
    '实习': 'intern', '设计师': 'designer', '软件开发': 'software developer'
  };
  return [['roles', job.role], ['industries', job.industry], ['cities', job.city]].every(([key, text]) => {
    const target = normalize(text);
    return !preferences[key].length || preferences[key].some(value => {
      const term = normalize(value).replace(/市$/, '');
      const alternate = equivalents[term];
      return target.includes(term) || (alternate && target.includes(alternate));
    });
  });
}

async function uploadResume(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const status = $('#parse-status');
  const revision = ++parseRevision;
  const extension = file.name.split('.').pop().toLowerCase();
  if (!['pdf', 'docx'].includes(extension) || file.size > 10 * 1024 * 1024) {
    status.textContent = file.size > 10 * 1024 * 1024 ? '文件超过 10 MB，请选择更小的文件或粘贴文本。' : '请选择 PDF 或 DOCX 文件。';
    return;
  }
  if (hasProfile() && !window.confirm('用上传的简历替换当前简历文字和关键词？求职偏好会保留。')) {
    status.textContent = '已保留当前档案。';
    return;
  }
  status.textContent = '正在本机读取简历…';
  try {
    const text = (await readResumeFile(file, extension)).trim();
    if ((text.match(/[\p{L}\p{N}]/gu) ?? []).length < 100) throw new Error(PARSE_ERROR);
    if (revision !== parseRevision) return;
    updateResume(text, true);
    $('#resume-text').value = text;
    refreshProfile();
    status.textContent = '简历已读取，可以编辑下方关键词。';
    if (!demo) {
      originalResume(text, file).catch(() => {
        if (revision === parseRevision) status.textContent = '简历已读取。原件可在审阅页重新关联。';
      });
    }
    if (extension === 'docx') readWordPackage(file).then(pkg => {
      if (revision === parseRevision) renderResumeStyle(wordLayout(pkg));
    }).catch(() => {});
  } catch {
    if (revision === parseRevision) status.textContent = PARSE_ERROR;
  }
}

function radar(scores) {
  const point = (index, score) => {
    const angle = -Math.PI / 2 + index * 2 * Math.PI / 5;
    return [160 + Math.cos(angle) * score, 138 + Math.sin(angle) * score];
  };
  const ring = score => K.map((_, index) => point(index, score).join(',')).join(' ');
  const values = scores.map((score, index) => point(index, score ?? 100).join(',')).join(' ');
  return `<svg viewBox="0 0 320 246" class="rd" aria-hidden="true">
    ${[25, 50, 75, 100].map(score => `<polygon points="${ring(score)}" fill="none" stroke="var(--line)"/>`).join('')}
    ${K.map((key, index) => {
      const [x, y] = point(index, 100);
      const [labelX, labelY] = point(index, 124);
      return `<line x1="160" y1="138" x2="${x}" y2="${y}" stroke="var(--line)"/>
        <text x="${labelX}" y="${labelY + 3}" text-anchor="middle" font-size="11" fill="var(--mut)">${key}</text>`;
    }).join('')}
    <polygon class="pg" style="transform-origin:160px 138px" points="${values}" fill="var(--acc)" fill-opacity=".25" stroke="var(--acc)" stroke-width="2"/>
    ${scores.map((score, index) => {
      const [x, y] = point(index, score ?? 100);
      return `<circle cx="${x}" cy="${y}" r="4" fill="${score === null ? 'var(--card)' : fitBand(score).color}"
        stroke="${fitBand(score).color}" stroke-width="2"/>`;
    }).join('')}</svg>
    <div aria-label="各维度适配程度">${K.map((label, index) => {
      const score = scores[index];
      const band = fitBand(score);
      return `<div class="match-row" style="--tone:${band.color}"><span>${label}</span>
        <div class="bar" aria-hidden="true"><i style="width:${score ?? 100}%"></i></div>
        <b>${score === null ? band.label : score + ' · ' + band.label}</b></div>`;
    }).join('')}</div>`;
}

function fitBand(score) {
  if (score === null) return { label: '无要求 · 默认适配', color: 'var(--mut)' };
  if (score >= 85) return { label: '高度适配', color: 'light-dark(#087560,#69d9b7)' };
  if (score >= 65) return { label: '基本适配', color: 'var(--acc)' };
  if (score >= 40) return { label: '部分适配', color: 'light-dark(#986000,#ffbf65)' };
  return { label: '差距较大', color: 'light-dark(#b43851,#ff8ca4)' };
}

const DEFAULT_PREP_GOAL = '帮我判断这个岗位值不值得投。如果值得，准备一份定制简历草稿。';
const VERDICTS = { apply: '建议投递', conditional: '有条件投递', hold: '建议暂缓' };

function evidenceForJD(result, profile) {
  const lines = profile.resumeText.split(/\r?\n/);
  const terms = scoringTerms(profile).flat();
  const patterns = new Map(terms.map(([word]) => [word, TERM_PATTERNS.get(word) ?? keywordPattern([word])]));
  const requirements = jdRequirements(result.jd, result.job, patterns);
  const sections = resumeSections(profile.resumeText);
  const experience = new Set([...sections.projects, ...sections.experience].map(normalize));
  const evidence = [];
  for (const [word, requirement] of [...requirements].sort((a, b) => b[1].weight - a[1].weight)) {
    const pattern = patterns.get(word);
    const matches = lines.map((line, index) => ({ text: normalize(line), line: index + 1 }))
      .filter(item => !/未参与|未做|尚未|没有使用|没做过|不了解|不熟悉/u.test(item.text) && pattern.test(item.text));
    const work = matches.find(item => experience.has(item.text));
    const match = work ?? matches[0];
    if (match) evidence.push({ line: match.line, requirement: word, work: Boolean(work), required: requirement.weight === 1 });
  }
  return evidence.slice(0, 10);
}

function localPreparation(result, profile, task) {
  const fresh = analyzeJD(result.jd, profile);
  const evidence = evidenceForJD(result, profile);
  const blocker = fresh.gaps.find(gap => gap.weight === 1 && (!gap.strength || (gap.target && !gap.actual)));
  if (blocker && !task.answer && !task.skip) {
    return { requirement: blocker.w, question: EDUCATION_FACTS.has(blocker.w)
      ? '你目前是否符合「' + blocker.w + '」这项学历或专业要求？请说明可以写入简历的事实。'
      : '对于「' + blocker.w + '」，你有可以写入简历的实际经历吗？请说明做过什么、你负责哪一部分，以及可确认的结果。' };
  }
  const confirmed = task.answer && task.confirmed && task.requirement === blocker?.w ? task.requirement : '';
  const gaps = fresh.gaps.filter(gap => gap.w !== confirmed);
  const verdict = !evidence.length && !confirmed ? 'hold' :
    gaps.some(gap => gap.weight === 1) || fresh.total === null || (!confirmed && fresh.total < 80) ? 'conditional' : 'apply';
  return { verdict, evidence, gaps: gaps.map(gap => gap.w), confirmed,
    summary: verdict === 'apply' ? '主要岗位要求有简历原文或本次明确补充作为依据，可准备定制稿。' :
      '已找到的证据列在下方，尚待确认的要求仍保留为缺口。' };
}

const REVIEW_DRAFT_VERSION = 4;

function layoutAssessment(before, after, mode) {
  const a = Array.from(String(before ?? '').trim()).length;
  const b = Array.from(String(after ?? '').trim()).length;
  const growth = a ? (b - a) / a : b ? 1 : 0;
  const reasons = [];
  if (mode === 'pdf_limited' && growth > .08) reasons.push('修改后文字增长超过 8%');
  if (mode === 'pdf_limited' && String(after).split(/\r?\n/).length > String(before).split(/\r?\n/).length) reasons.push('修改后新增行数');
  if (mode === 'text_draft') reasons.push('纯文本无法继承原始版式');
  return { layoutRisk: reasons.length > 0, lengthBefore: a, lengthAfter: b, reasons };
}

function evidenceRewrite(line, requirement, jd) {
  const text = line.trim();
  const wantsAnalysis = /数据分析|数据清洗|Excel|SQL|指标|漏斗|留存|转化/u.test(requirement + ' ' + jd);
  if (wantsAnalysis && /广告负反馈治理/u.test(text) && /2,?149|SQL|Excel/u.test(text)) {
    return line
      .replace(/广告负反馈治理[：:]/u, '广告负反馈治理与数据分析：')
      .replace(/对\s*2,?149\s*条广告体验反馈进行清洗、归因及标签化/u,
        '清洗、归因及标签化 2,149 条广告体验反馈')
      .replace(/进一步结合\s*SQL\s*与\s*Excel[，,]从/u,
        '并使用 SQL 与 Excel 从')
      .replace(/交叉分析曝光、CTR、eCPM\s*与负反馈率/u,
        '对曝光、CTR、eCPM 与负反馈率开展交叉分析');
  }
  if (/PRD|需求|流程|协同|推动/u.test(requirement + ' ' + jd) &&
      /一键返回能力建设/u.test(text) && /PRD|流程图|策略配置/u.test(text)) {
    return line.replace(/一键返回能力建设[：:]/u, '一键返回产品能力建设：')
      .replace(/输出\s*PRD、业务流程图和策略配置方案/u,
        '沉淀 PRD、业务流程图与策略配置方案');
  }
  return line.replace(/^(\s*(?:[-•●▪·]\s*)?)(?:在该项目中|在实习期间)[，,:：]\s*/u, '$1')
    .replace(/^(\s*(?:[-•●▪·]\s*)?)(?:本人主要负责|本人负责|主要负责)/u, '$1负责')
    .replace(/^(\s*(?:[-•●▪·]\s*)?)(?:本人主要参与|本人参与|主要参与)/u, '$1参与');
}

function reviewDraft(result, source, evidence, addition = '') {
  const originals = source.split(/\r?\n/);
  const references = Object.fromEntries(evidence.map(item => [item.line, item.requirement]));
  const jd = result.jd || '';
  if (/数据分析|数据清洗|Excel|SQL|指标|漏斗|留存|转化/u.test(jd)) {
    const analysisLine = originals.findIndex(line => /广告负反馈治理/u.test(line) && /2,?149|SQL|Excel/u.test(line));
    if (analysisLine >= 0) references[analysisLine + 1] = '数据分析 · 用已有反馈数据、工具、指标和结论强化证据';
  }
  if (/PRD|需求文档|流程图|协同|推动/u.test(jd)) {
    const productLine = originals.findIndex(line => /一键返回能力建设/u.test(line) && /PRD|流程图|策略配置/u.test(line));
    if (productLine >= 0) references[productLine + 1] = '产品能力 · 用已有 PRD、流程和上线协同强化证据';
  }
  const summary = addition.trim() ? '补充经历\n' + addition.trim() : '';
  const edits = originals.map((line, index) => {
    if (!Object.hasOwn(references, index + 1)) return line;
    return evidenceRewrite(line, references[index + 1], jd);
  });
  return { version: REVIEW_DRAFT_VERSION, jd: result.jd, source, edits: [summary, ...edits], decisions: {}, origins: [],
    references: { ...references, 0: summary ? '本次由你补充的原话' : '' } };
}

function reviewDraftFromPatches(result, source, patches) {
  const originals = source.split(/\r?\n/);
  const edits = ['', ...originals];
  const references = { 0: '' };
  const accepted = [];
  for (const patch of Array.isArray(patches) ? patches : []) {
    const line = Number(patch.source_line);
    if (!Number.isInteger(line) || line < 1 || line > originals.length ||
        originals[line - 1] !== patch.before || !patch.verified) continue;
    edits[line] = patch.after;
    references[line] = patch.reason || '已通过证据与事实校验';
    accepted.push({ ...patch });
  }
  return { version: REVIEW_DRAFT_VERSION, jd: result.jd, source, edits, decisions: {}, origins: [],
    references, patches: accepted, generatedBy: 'agent_v4_3' };
}

function samePreparation(item, result, source = state.profile.resumeText) {
  return item?.jd === result.jd && item.source === source;

function resumeStyle(text) {
  const sections = resumeSections(text);
  const experience = [...sections.experience, ...sections.projects].filter(line => line.trim());
  const lines = experience.length ? experience : text.split(/\r?\n/).filter(line => line.trim());
  const lengths = lines.map(line => Array.from(line.trim()).length).sort((a, b) => a - b);
  const median = lengths[Math.floor(lengths.length / 2)] ?? 0;
  const bullets = lines.filter(line => /^\s*(?:[-•●▪·]\s*|\d+[.)、]\s*)/u.test(line)).length;
  const form = bullets ? '条目式' : median > 85 ? '长段落式' : '短段落式';
  return lines.length ? form + ' · 常见段落约 ' + median + ' 字 · 沿用章节顺序' : '导入简历后读取表达风格';
}

const WORD_TYPE = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
const WORD_PART = 'word/document.xml';
const ZIP_SCRIPT = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
const WORD_PREVIEW_SCRIPT = 'https://cdn.jsdelivr.net/npm/docx-preview@0.3.7/dist/docx-preview.min.js';

function wordTextKey(text) {
  return text.normalize('NFKC').replace(/\s+/gu, ' ').trim();
}

async function readWordPackage(file) {
  const JSZip = await loadParser(ZIP_SCRIPT, 'JSZip');
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const part = zip.file(WORD_PART);
  if (!part) throw new Error('缺少 Word 正文');
  const xml = new DOMParser().parseFromString(await part.async('string'), 'application/xml');
  const ns = xml.documentElement.namespaceURI;
  const body = xml.getElementsByTagNameNS(ns, 'body')[0];
  if (!body || xml.documentElement.localName !== 'document') throw new Error('无法读取 Word 正文');
  return { zip, xml, ns, body };
}

function wordParagraphs(pkg) {
  const rows = new Map();
  for (const paragraph of pkg.body.getElementsByTagNameNS(pkg.ns, 'p')) {
    const nodes = [...paragraph.getElementsByTagNameNS(pkg.ns, 't')];
    const text = nodes.map(node => node.textContent).join('');
    const key = wordTextKey(text);
    if (!key) continue;
    const allowedParagraph = new Set(['pPr', 'r', 'proofErr', 'bookmarkStart', 'bookmarkEnd']);
    const allowedRun = new Set(['rPr', 't']);
    const simple = [...paragraph.children].every(node => node.namespaceURI === pkg.ns &&
      allowedParagraph.has(node.localName) && (node.localName !== 'r' ||
        [...node.children].every(child => child.namespaceURI === pkg.ns && allowedRun.has(child.localName))));
    let inBody = true;
    for (let parent = paragraph.parentElement; parent && parent !== pkg.body; parent = parent.parentElement) {
      if (!['tbl', 'tr', 'tc'].includes(parent.localName) || parent.namespaceURI !== pkg.ns) inBody = false;
    }
    const group = rows.get(key) ?? [];
    group.push({ text, nodes, simple: simple && inBody });
    rows.set(key, group);
  }
  return rows;
}

function replaceWordText(row, replacement, ns) {
  if (!row?.simple || !replacement.trim() || /[\u0000-\u001f\u007f]/u.test(replacement)) return false;
  const before = Array.from(row.text);
  const after = Array.from(replacement);
  let start = 0;
  while (start < Math.min(before.length, after.length) && before[start] === after[start]) start++;
  let suffix = 0;
  while (suffix < Math.min(before.length, after.length) - start &&
    before[before.length - 1 - suffix] === after[after.length - 1 - suffix]) suffix++;
  if (start === before.length && start === after.length) return true;
  const end = before.length - suffix;
  let offset = 0;
  const pieces = row.nodes.map(node => {
    const chars = Array.from(node.textContent);
    const piece = { node, chars, start: offset, end: offset + chars.length };
    offset = piece.end;
    return piece;
  }).filter(piece => piece.chars.length);
  const affected = start === end ? [pieces.find(piece => piece.start < start && piece.end >= start) ?? pieces[0]] :
    pieces.filter(piece => piece.end > start && piece.start < end);
  if (!affected[0]) return false;
  const serializer = new XMLSerializer();
  const formatting = ({ node }) => {
    const style = [...node.parentElement.children].find(child => child.namespaceURI === ns && child.localName === 'rPr');
    return style ? serializer.serializeToString(style) : '';
  };
  if (affected.some(piece => formatting(piece) !== formatting(affected[0]))) {
    const match = replacement.match(/^\s*([^：:]{1,36}[：:])(.*)$/u);
    const bold = node => node.parentElement.getElementsByTagNameNS(ns, 'b').length > 0 &&
      ![...node.parentElement.getElementsByTagNameNS(ns, 'b')].some(item => item.getAttributeNS(ns, 'val') === '0');
    const labelNode = row.nodes.find(bold);
    const bodyNode = row.nodes.find(node => node !== labelNode && !bold(node));
    if (!match || !labelNode || !bodyNode) return false;
    row.nodes.forEach(node => { node.textContent = ''; });
    labelNode.textContent = match[1];
    bodyNode.textContent = match[2];
    if (/^\s|\s$/u.test(bodyNode.textContent)) {
      bodyNode.setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve');
    }
    return true;
  }
  const inserted = after.slice(start, after.length - suffix).join('');
  for (const [index, piece] of affected.entries()) {
    const prefix = piece.chars.slice(0, Math.max(0, start - piece.start)).join('');
    const tail = piece.chars.slice(Math.max(0, end - piece.start)).join('');
    piece.node.textContent = prefix + (index === 0 ? inserted : '') + tail;
    if (/^\s|\s$/u.test(piece.node.textContent)) {
      piece.node.setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve');
    }
  }
  return true;
}

async function revisedWord(file, original, draft) {
  const pkg = await readWordPackage(file);
  const rows = wordParagraphs(pkg);
  const sourceCounts = new Map();
  for (const text of original.slice(1)) {
    const key = wordTextKey(text);
    sourceCounts.set(key, (sourceCounts.get(key) ?? 0) + 1);
  }
  const applied = new Set();
  const skipped = [];
  for (const [index, replacement] of draft.edits.entries()) {
    if (draft.decisions[index] !== 'accept' || replacement === original[index]) continue;
    const key = wordTextKey(original[index] ?? '');
    const group = rows.get(key);
    if (index && sourceCounts.get(key) === 1 && group?.length === 1 &&
      replaceWordText(group[0], replacement, pkg.ns)) applied.add(index);
    else skipped.push(index);
  }
  if (!applied.size) return { blob: file, applied, skipped };
  pkg.zip.file(WORD_PART, new XMLSerializer().serializeToString(pkg.xml), { createFolders: false });
  const blob = await pkg.zip.generateAsync({ type: 'blob', mimeType: WORD_TYPE, compression: 'DEFLATE' });
  return { blob, applied, skipped };
}

function wordLayout(pkg) {
  const details = [];
  if (Object.keys(pkg.zip.files).some(path => /^word\/media\/[^/]+$/u.test(path))) details.push('含嵌入图片');
  if ([...pkg.xml.getElementsByTagNameNS('*', 'anchor')].length) details.push('含浮动图片（网页预览可能与 Word 有差异）');
  if ([...pkg.xml.getElementsByTagNameNS(pkg.ns, 'cols')].some(node => Number(node.getAttributeNS(pkg.ns, 'num')) > 1)) details.push('含分栏');
  const styles = [...pkg.xml.getElementsByTagNameNS(pkg.ns, 'pStyle')]
    .map(node => node.getAttributeNS(pkg.ns, 'val') ?? '');
  if (pkg.xml.getElementsByTagNameNS(pkg.ns, 'numPr').length ||
    styles.some(style => /list|bullet|number|列表/iu.test(style))) details.push('含 Word 列表');
  if (styles.some(style => /heading|title|标题/iu.test(style))) details.push('含标题样式');
  return details;
}

async function wordPreviewData(blob) {
  const pkg = await readWordPackage(blob);
  for (const name of Object.keys(pkg.zip.files).filter(path => path.endsWith('.rels'))) {
    const document = new DOMParser().parseFromString(await pkg.zip.file(name).async('string'), 'application/xml');
    const external = [...document.getElementsByTagNameNS('*', 'Relationship')]
      .filter(relation => relation.getAttribute('TargetMode') === 'External');
    if (external.length) {
      external.forEach(relation => relation.remove());
      pkg.zip.file(name, new XMLSerializer().serializeToString(document), { createFolders: false });
    }
  }
  return { data: await pkg.zip.generateAsync({ type: 'arraybuffer' }), details: wordLayout(pkg) };
}

async function wordPdfPreview(blob) {
  if (!databaseMode) throw new Error('Word PDF preview requires the local service');
  const response = await fetch('/api/word-preview', { method: 'POST', headers: { 'Content-Type': WORD_TYPE },
    body: blob, cache: 'no-store', signal: AbortSignal.timeout(9000) });
  if (!response.ok) throw new Error('Word PDF preview unavailable');
  const pdf = await response.blob();
  if (pdf.type !== 'application/pdf' || pdf.size < 100) throw new Error('Invalid Word PDF preview');
  return pdf;
}

async function runPreparation(area, result, task) {
  const workspace = state;
  const status = area.querySelector('#prepare-status');
  const buttons = [...area.querySelectorAll('button')];
  buttons.forEach(button => { button.disabled = true; });
  status.textContent = '正在核对 JD 和档案证据…';
  try {
    let outcome;
    if (databaseMode && !demo) {
      const lines = task.source.split(/\r?\n/).map(line => /@|(?:手机号|联系电话|住址|手机|电话)\s*[:：]/u.test(line) ? '' : line);
      const response = await fetch('/api/agent/run', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ run_id: task.run_id ?? '', jd: task.jd, goal: task.goal,
          answer: task.answer ?? '', confirmed: task.confirmed === true, skip: Boolean(task.skip), lines,
          levels: Object.fromEntries(resumeLevels(workspace.profile)) }), signal: AbortSignal.timeout(30000) });
      if (!response.ok) throw new Error('model');
      outcome = await response.json();
    } else {
      outcome = localPreparation(result, workspace.profile, task);
    }
    if (state !== workspace || !area.isConnected || !samePreparation(task, result)) return;
    const { question, requirement, packet, ...base } = task;
    const next = { ...base, mode: databaseMode && !demo ? 'agent_v4_5' : 'local',
      run_id: outcome.run_id ?? task.run_id, tool_trace: outcome.tool_trace ?? task.tool_trace };
    state.preparation = outcome.question ? { ...next, question: outcome.question, requirement: outcome.requirement,
      requirement_id: outcome.requirement_id } : { ...next, askedRequirement: task.requirement, packet: outcome };
    if (!outcome.question && outcome.patches?.length) state.rewrite = reviewDraftFromPatches(result, task.source, outcome.patches);
    else if (!outcome.question && databaseMode && !demo) delete state.rewrite;
    save();
    renderPreparation(result);
  } catch {
    if (area.isConnected) status.textContent = '暂时未能生成准备包。可重试，或使用本地规则模式。';
  } finally {
    buttons.forEach(button => { button.disabled = false; });
  }
}
